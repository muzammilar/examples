global
  maxconn 256
  log stdout format raw local0
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
  hold nx 2s
  hold timeout 2s
  hold refused 2s
  hold other 2s
defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 180s
  timeout server 180s
frontend s3
  bind :9000
  default_backend rgw
frontend health
  bind :8404
  http-request return status 503 content-type text/plain string unavailable if { nbsrv(rgw) lt 1 }
  http-request return status 200 content-type text/plain string ready
listen stats
  bind :8405
  stats enable
  stats uri /stats
backend rgw
  balance roundrobin
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host s3
  http-check expect status 200
  http-check expect string ListAllMyBucketsResult
  server rgw0 guests:9001 check resolvers docker resolve-opts allow-dup-ip resolve-prefer ipv4 init-addr libc,none inter 2s fall 2 rise 2
  server rgw1 guests:9002 check resolvers docker resolve-opts allow-dup-ip resolve-prefer ipv4 init-addr libc,none inter 2s fall 2 rise 2
  server rgw2 guests:9003 check resolvers docker resolve-opts allow-dup-ip resolve-prefer ipv4 init-addr libc,none inter 2s fall 2 rise 2
