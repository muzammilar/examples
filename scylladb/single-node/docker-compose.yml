name: scylladb-single

services:
  # Each ScyllaDB shard reserves ~11k Linux AIO contexts; Docker Desktop's VM
  # defaults to fs.aio-max-nr=65536. This one-shot raises it for the whole
  # Docker VM (not namespaced; resets when Docker restarts).
  sysctl:
    image: busybox:1.37
    privileged: true
    command: sysctl -w fs.aio-max-nr=1048576

  scylla:
    # 2026.1.x on purpose: it is ScyllaDB's current LTS line (newer feature
    # releases exist); bump within 2026.1 for patch fixes.
    image: scylladb/scylla:${SCYLLA_VERSION:-2026.1.13}
    container_name: scylla
    hostname: scylla
    command: --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
    ports:
      - "127.0.0.1:9042:9042" # CQL, localhost only: no auth (AllowAllAuthenticator)
    depends_on:
      sysctl: { condition: service_completed_successfully }
    volumes:
      - scylla-data:/var/lib/scylla
      - ./cql:/cql:ro
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT now() FROM system.local"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  scylla-data:
