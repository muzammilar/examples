name: scylladb-cluster

# Three ScyllaDB nodes in one datacenter. scylla-1 is the seed; the others
# join one at a time (depends_on + healthcheck) so bootstrap never overlaps.
x-scylla: &scylla
  image: scylladb/scylla:${SCYLLA_VERSION:-2026.1.13}
  command: --seeds scylla-1 --smp 1 --memory 750M --overprovisioned 1 --developer-mode 1
  healthcheck:
    test: ["CMD", "cqlsh", "-e", "SELECT now() FROM system.local"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 30s

services:
  # Each ScyllaDB shard reserves ~11k Linux AIO contexts; Docker Desktop's VM
  # defaults to fs.aio-max-nr=65536. This one-shot raises it for the whole
  # Docker VM (not namespaced; resets when Docker restarts).
  sysctl:
    image: busybox:1.37
    privileged: true
    command: sysctl -w fs.aio-max-nr=1048576

  scylla-1:
    <<: *scylla
    container_name: scylla-1
    hostname: scylla-1
    ports: ["9042:9042"]
    volumes: [scylla-1:/var/lib/scylla, ./cql:/cql:ro]
    depends_on:
      sysctl: { condition: service_completed_successfully }
  scylla-2:
    <<: *scylla
    container_name: scylla-2
    hostname: scylla-2
    volumes: [scylla-2:/var/lib/scylla]
    depends_on:
      scylla-1: { condition: service_healthy }
  scylla-3:
    <<: *scylla
    container_name: scylla-3
    hostname: scylla-3
    volumes: [scylla-3:/var/lib/scylla]
    depends_on:
      scylla-2: { condition: service_healthy }

  # ScyllaDB serves Prometheus metrics natively on :9180.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: scylla-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/upstream:/etc/prometheus/upstream:ro # recording rules, fetched by `make dashboards`

  grafana:
    image: grafana/grafana:13.2.2
    container_name: scylla-grafana
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

volumes:
  scylla-1:
  scylla-2:
  scylla-3:
