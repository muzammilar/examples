name: postgres-pgdog-pooling
services:
  etcd0:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd0
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd0:2380
      - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - --initial-cluster-token=customer-sharding
    volumes:
      - etcd0:/etcd-data
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 3s
      timeout: 3s
      retries: 40
  etcd1:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd1
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - --initial-cluster-token=customer-sharding
    volumes:
      - etcd1:/etcd-data
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 3s
      timeout: 3s
      retries: 40
  etcd2:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd2
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - --initial-cluster-token=customer-sharding
    volumes:
      - etcd2:/etcd-data
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 3s
      timeout: 3s
      retries: 40
  s0n0:
    build: ./patroni
    image: postgres-pgdog-patroni:dev
    environment:
      PATRONI_SCOPE: shard0
      PATRONI_NAME: s0n0
      PATRONI_RESTAPI_CONNECT_ADDRESS: s0n0:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: s0n0:5432
    depends_on:
      etcd0: {condition: service_healthy}
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
    volumes:
      - s0n0:/var/lib/postgresql/patroni
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8008/health]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
  s0n1:
    build: ./patroni
    image: postgres-pgdog-patroni:dev
    environment:
      PATRONI_SCOPE: shard0
      PATRONI_NAME: s0n1
      PATRONI_RESTAPI_CONNECT_ADDRESS: s0n1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: s0n1:5432
    depends_on:
      etcd0: {condition: service_healthy}
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
    volumes:
      - s0n1:/var/lib/postgresql/patroni
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8008/health]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
  s0n2:
    build: ./patroni
    image: postgres-pgdog-patroni:dev
    environment:
      PATRONI_SCOPE: shard0
      PATRONI_NAME: s0n2
      PATRONI_RESTAPI_CONNECT_ADDRESS: s0n2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: s0n2:5432
    depends_on:
      etcd0: {condition: service_healthy}
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
    volumes:
      - s0n2:/var/lib/postgresql/patroni
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8008/health]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
  pgdog:
    image: ghcr.io/pgdogdev/pgdog:v0.1.62
    environment:
      PGPASSWORD: local-postgres
    healthcheck:
      test: [CMD, psql, -h, localhost, -p, '6432', -U, postgres, -d, orders, -Atqc, 'SELECT 1']
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s
    volumes:
      - ./config/pgdog.toml:/pgdog/pgdog.toml:ro
      - ./config/users.toml:/pgdog/users.toml:ro
    command: ["pgdog", "--config=/pgdog/pgdog.toml", "--users=/pgdog/users.toml"]
    ports:
      - "127.0.0.1:${PGDOG_PORT:-6433}:6432"
    depends_on:
      s0n0: {condition: service_healthy}
      s0n1: {condition: service_healthy}
      s0n2: {condition: service_healthy}
  client:
    profiles: [tools]
    image: postgres:17.6-bookworm
    environment:
      PGPASSWORD: local-postgres
    volumes:
      - ./sql:/sql:ro
  workload:
    profiles: [tools]
    image: postgres-pgdog-workload:dev
    build: ./app
    environment:
      DRIVER: pgx
      DSN: postgres://postgres:local-postgres@pgdog:6432/orders?sslmode=disable
      COUNT: ${COUNT:-1000000}
      CUSTOMERS: ${CUSTOMERS:-10000}
      WORKERS: ${WORKERS:-8}
      BATCH: ${BATCH:-100}
      BULK: ${BULK:-1}
      RATE: ${RATE:-0}
    volumes:
      - ./${RESULTS_DIR:-results/manual}:/results
volumes:
  etcd0:
  etcd1:
  etcd2:
  s0n0:
  s0n1:
  s0n2:
