global
  log stdout format raw local0
defaults
  log global
  mode tcp
  timeout connect 3s
  timeout client 2m
  timeout server 2m
frontend sql
  bind *:5432
  default_backend coordinator
backend coordinator
  option httpchk GET /primary
  http-check expect status 200
  server coord0 s0n0:5432 check port 8008 inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
  server coord1 s0n1:5432 check port 8008 inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
  server coord2 s0n2:5432 check port 8008 inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
frontend health
  mode http
  bind *:8404
  http-request return status 200 if { nbsrv(coordinator) gt 0 }
  http-request return status 503
