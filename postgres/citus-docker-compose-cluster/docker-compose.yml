name: postgres-citus-cluster
services:
  etcd0:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd0
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd0:2380
      - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - --initial-cluster-token=customer-sharding
    volumes:
      - etcd0:/etcd-data
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 3s
      timeout: 3s
      retries: 40
  etcd1:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd1
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - --initial-cluster-token=customer-sharding
    volumes:
      - etcd1:/etcd-data
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 3s
      timeout: 3s
      retries: 40
  etcd2:
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd2
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
      - --initial-cluster-token=customer-sharding
    volumes:
      - etcd2:/etcd-data
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 3s
      timeout: 3s
      retries: 40
  s0n0:
    build: ./patroni
    image: postgres-citus-patroni:dev
    environment:
      PATRONI_SCOPE: citus
      PATRONI_CITUS_GROUP: 0
      PATRONI_CITUS_DATABASE: postgres
      PATRONI_NAME: s0n0
      PATRONI_RESTAPI_CONNECT_ADDRESS: s0n0:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: s0n0:5432
    depends_on:
      etcd0: {condition: service_healthy}
      etcd1: {condition: service_healthy}
      etcd2: {condition: service_healthy}
    volumes:
      - s0n0:/var/lib/postgresql/patroni
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8008/health]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 30s
  s0n1:
    build: ./patroni
    image: postgres-citus-patroni:dev
    environment:
      PATRONI_SCOPE: citus
      PATRONI_CITUS_GROUP: 0
