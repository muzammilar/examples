  router:
    image: haproxy:3.2.4-alpine
    ports:
      - "127.0.0.1:${CITUS_PORT:-5433}:5432"
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8404/]
      interval: 3s
      timeout: 3s
      retries: 80
    depends_on:
      s0n0: {condition: service_healthy}
      s0n1: {condition: service_healthy}
      s0n2: {condition: service_healthy}
  client:
    profiles: [tools]
    image: postgres:18.0-bookworm
    environment:
      PGPASSWORD: local-postgres
    volumes:
      - ./sql:/sql:ro
  workload:
    image: postgres-citus-workload:dev
    profiles: [tools]
    build: ./app
    environment:
      DRIVER: pgx
      DSN: postgres://postgres:local-postgres@router:5432/postgres?sslmode=disable
      COUNT: ${COUNT:-1000000}
      ANALYTICS_QUERIES: ${ANALYTICS_QUERIES:-25}
      ANALYTICS_REQUESTS: ${ANALYTICS_REQUESTS:-200}
      CUSTOMERS: ${CUSTOMERS:-10000}
      WORKERS: ${WORKERS:-8}
      BATCH: ${BATCH:-100}
      BULK: ${BULK:-1}
      RATE: ${RATE:-0}
    volumes:
      - ./${RESULTS_DIR:-results/manual}:/results
