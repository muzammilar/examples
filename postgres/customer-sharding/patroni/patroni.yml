namespace: /customer-sharding/
restapi:
  listen: 0.0.0.0:8008
etcd3:
  hosts: etcd0:2379,etcd1:2379,etcd2:2379
bootstrap:
  dcs:
    ttl: 20
    loop_wait: 3
    retry_timeout: 5
    maximum_lag_on_failover: 0
    synchronous_mode: true
    synchronous_mode_strict: true
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        wal_keep_size: 512MB
        max_wal_senders: 10
        max_replication_slots: 10
        hot_standby: 'on'
        shared_buffers: 128MB
        max_connections: 100
        synchronous_commit: 'on'
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256
postgresql:
  listen: 0.0.0.0:5432
  bin_dir: /usr/lib/postgresql/17/bin
  data_dir: /var/lib/postgresql/patroni/data
  remove_data_directory_on_rewind_failure: true
  remove_data_directory_on_diverged_timelines: true
  authentication:
    superuser:
      username: postgres
      password: local-postgres
    replication:
      username: replicator
      password: local-replication
    rewind:
      username: postgres
      password: local-postgres
