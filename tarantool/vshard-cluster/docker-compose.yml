name: tarantool-vshard

# A vshard cluster on Tarantool 3: storage replicasets of 2 instances (manual failover, the
# `leader` in the config is the master) and one router. 3,000 buckets; the router maps
# id -> bucket (crc32) -> replicaset. `make up` runs storage-a and storage-b; storage-c (profile
# `scale`) is added and removed by `make scale-out` / `make scale-in`. app/config.yaml is
# generated by scripts/config.sh and read by every instance; config:reload() applies changes.
x-tarantool: &tarantool
  build:
    context: .
    args: { TARANTOOL_VERSION: "${TARANTOOL_VERSION:-3.8.1}" }
  image: tarantool-vshard:local
  working_dir: /opt/tarantool/vshard   # app.file is relative to it
  healthcheck:
    test: ["CMD", "status"]
    interval: 2s
    timeout: 5s
    retries: 30

x-storage: &storage
  <<: *tarantool

services:
  storage-a-001:
    <<: *storage
    container_name: tarantool-storage-a-001
    hostname: storage-a-001
    environment: { TT_APP_NAME: vshard, TT_INSTANCE_NAME: storage-a-001 }
    volumes: [./app:/opt/tarantool/vshard:ro, storage-a-001:/var/lib/tarantool]
  storage-a-002:
    <<: *storage
    container_name: tarantool-storage-a-002
    hostname: storage-a-002
    environment: { TT_APP_NAME: vshard, TT_INSTANCE_NAME: storage-a-002 }
    volumes: [./app:/opt/tarantool/vshard:ro, storage-a-002:/var/lib/tarantool]
  storage-b-001:
    <<: *storage
    container_name: tarantool-storage-b-001
    hostname: storage-b-001
    environment: { TT_APP_NAME: vshard, TT_INSTANCE_NAME: storage-b-001 }
    volumes: [./app:/opt/tarantool/vshard:ro, storage-b-001:/var/lib/tarantool]
  storage-b-002:
    <<: *storage
    container_name: tarantool-storage-b-002
    hostname: storage-b-002
    environment: { TT_APP_NAME: vshard, TT_INSTANCE_NAME: storage-b-002 }
    volumes: [./app:/opt/tarantool/vshard:ro, storage-b-002:/var/lib/tarantool]
  storage-c-001:
    <<: *storage
    profiles: [scale]
    container_name: tarantool-storage-c-001
    hostname: storage-c-001
    environment: { TT_APP_NAME: vshard, TT_INSTANCE_NAME: storage-c-001 }
    volumes: [./app:/opt/tarantool/vshard:ro, storage-c-001:/var/lib/tarantool]
  storage-c-002:
    <<: *storage
    profiles: [scale]
    container_name: tarantool-storage-c-002
    hostname: storage-c-002
    environment: { TT_APP_NAME: vshard, TT_INSTANCE_NAME: storage-c-002 }
    volumes: [./app:/opt/tarantool/vshard:ro, storage-c-002:/var/lib/tarantool]
  router-a-001:
    <<: *tarantool
    container_name: tarantool-router-a-001
    hostname: router-a-001
    environment: { TT_APP_NAME: vshard, TT_INSTANCE_NAME: router-a-001 }
    volumes: [./app:/opt/tarantool/vshard:ro, router-a-001:/var/lib/tarantool]
    ports: ["127.0.0.1:${TARANTOOL_ROUTER_PORT:-3321}:3301"]
    depends_on:
      storage-a-001: { condition: service_healthy }
      storage-a-002: { condition: service_healthy }
      storage-b-001: { condition: service_healthy }
      storage-b-002: { condition: service_healthy }

  # `make test` / `make scale-*`: Lua clients (net.box) against the router. The image sets
  # TT_INSTANCE_NAME, which makes a plain `tarantool` look for a cluster config.
  client:
    image: tarantool-vshard:local
    profiles: [tools]
    working_dir: /work
    entrypoint: ["env", "-u", "TT_INSTANCE_NAME", "tarantool"]
    environment:
      ROUTER_URI: app:secret@router-a-001:3301
      WRITERS: ${WRITERS:-16}
      DURATION: ${LOAD_DURATION:-60}
      RUN: ${RUN:-1}
    volumes: [./scripts:/work/scripts:ro]

volumes:
  storage-a-001:
  storage-a-002:
  storage-b-001:
  storage-b-002:
  storage-c-001:
  storage-c-002:
  router-a-001:
