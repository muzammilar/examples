name: ${COMPOSE_PROJECT_NAME:-rustfs-s3-cluster}
services:
  rustfs0:
    image: rustfs/rustfs:1.0.5
    hostname: rustfs0
    cpus: 2
    mem_limit: 1536m
    environment:
      RUSTFS_VOLUMES: http://rustfs{0...3}:9000/data/disk0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-GK0123456789abcdef01234567}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-local-only-object-storage-secret-key}
      RUSTFS_REGION: us-east-1
      RUSTFS_STORAGE_CLASS_STANDARD: EC:2
      RUSTFS_SHARD_INTEGRITY_WRITE: 'true'
      RUSTFS_SHARD_INTEGRITY_FLEET_CONFIRMED: 'true'
      RUSTFS_DURABILITY_MODE: strict
    volumes:
    - data00:/data/disk0
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9000/health
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
  rustfs1:
    image: rustfs/rustfs:1.0.5
    hostname: rustfs1
    cpus: 2
    mem_limit: 1536m
    environment:
      RUSTFS_VOLUMES: http://rustfs{0...3}:9000/data/disk0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-GK0123456789abcdef01234567}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-local-only-object-storage-secret-key}
      RUSTFS_REGION: us-east-1
      RUSTFS_STORAGE_CLASS_STANDARD: EC:2
      RUSTFS_SHARD_INTEGRITY_WRITE: 'true'
      RUSTFS_SHARD_INTEGRITY_FLEET_CONFIRMED: 'true'
      RUSTFS_DURABILITY_MODE: strict
    volumes:
    - data10:/data/disk0
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9000/health
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
  rustfs2:
    image: rustfs/rustfs:1.0.5
    hostname: rustfs2
    cpus: 2
    mem_limit: 1536m
    environment:
      RUSTFS_VOLUMES: http://rustfs{0...3}:9000/data/disk0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-GK0123456789abcdef01234567}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-local-only-object-storage-secret-key}
      RUSTFS_REGION: us-east-1
      RUSTFS_STORAGE_CLASS_STANDARD: EC:2
      RUSTFS_SHARD_INTEGRITY_WRITE: 'true'
      RUSTFS_SHARD_INTEGRITY_FLEET_CONFIRMED: 'true'
      RUSTFS_DURABILITY_MODE: strict
    volumes:
    - data20:/data/disk0
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9000/health
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
  rustfs3:
    image: rustfs/rustfs:1.0.5
    hostname: rustfs3
    cpus: 2
    mem_limit: 1536m
    environment:
      RUSTFS_VOLUMES: http://rustfs{0...3}:9000/data/disk0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-GK0123456789abcdef01234567}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-local-only-object-storage-secret-key}
      RUSTFS_REGION: us-east-1
      RUSTFS_STORAGE_CLASS_STANDARD: EC:2
      RUSTFS_SHARD_INTEGRITY_WRITE: 'true'
      RUSTFS_SHARD_INTEGRITY_FLEET_CONFIRMED: 'true'
      RUSTFS_DURABILITY_MODE: strict
    volumes:
    - data30:/data/disk0
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9000/health
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
  s3:
    image: haproxy:3.2.8-alpine
    cpus: 0.5
    mem_limit: 128m
    volumes:
    - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8404/health
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      rustfs0:
        condition: service_healthy
      rustfs1:
        condition: service_healthy
      rustfs2:
        condition: service_healthy
      rustfs3:
        condition: service_healthy
  tools:
    image: ${COMPOSE_PROJECT_NAME:-rustfs-s3-cluster}-tools:dev
    build:
      context: ../..
      dockerfile: object-storage/client/Dockerfile
    profiles:
    - tools
    cpus: 2
    mem_limit: 2g
    environment:
      S3_ENDPOINT: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-GK0123456789abcdef01234567}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-only-object-storage-secret-key}
      OBJECTS: ${OBJECTS:-10000}
      LARGE_OBJECTS: ${LARGE_OBJECTS:-128}
      DURATION: ${DURATION:-120}
      BENCH_SMALL_REQUESTS: ${BENCH_SMALL_REQUESTS:-10000}
      BENCH_REQUESTS: ${BENCH_REQUESTS:-256}
      BENCH_LARGE_REQUESTS: ${BENCH_LARGE_REQUESTS:-128}
    volumes:
    - ./${RESULTS_DIR:-results/verified}:/results
  init:
    image: ${COMPOSE_PROJECT_NAME:-rustfs-s3-cluster}-tools:dev
    entrypoint:
    - python
    - -c
    - import os; [os.chown("/disks/"+str(i),10001,10001) for i in range(4)]
    volumes:
    - data00:/disks/0
    - data10:/disks/1
    - data20:/disks/2
    - data30:/disks/3
    network_mode: none
    cpus: 0.5
    mem_limit: 128m
  audit:
    extends: tools
    profiles:
    - tools
    entrypoint:
    - python
    - /app/rustfs_audit.py
    volumes:
    - data00:/disks/0:ro
    - data10:/disks/1:ro
    - data20:/disks/2:ro
    - data30:/disks/3:ro
volumes:
  data00: null
  data10: null
  data20: null
  data30: null
