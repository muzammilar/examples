global
  maxconn 256
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
  hold nx 2s
  hold timeout 2s
  hold refused 2s
  hold other 2s
defaults
  mode http
  timeout connect 3s
  timeout client 60s
  timeout server 60s
frontend s3
  bind :9000
  default_backend gateways
frontend health
  bind :8404
  http-request return status 200 content-type text/plain string ready
backend gateways
  balance roundrobin
  server node0 rustfs0:9000 check resolvers docker resolve-prefer ipv4 init-addr libc,none inter 1s fall 2 rise 2
  server node1 rustfs1:9000 check resolvers docker resolve-prefer ipv4 init-addr libc,none inter 1s fall 2 rise 2
  server node2 rustfs2:9000 check resolvers docker resolve-prefer ipv4 init-addr libc,none inter 1s fall 2 rise 2
  server node3 rustfs3:9000 check resolvers docker resolve-prefer ipv4 init-addr libc,none inter 1s fall 2 rise 2
