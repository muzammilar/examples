name: doris-single-node
services:
  fe:
    build: {context: ., dockerfile: docker/Dockerfile.fe}
    image: examples/doris-single-fe:4.0.8
    cpus: 1
    mem_limit: 2g
    environment:
      FE_SERVERS: fe1:172.30.41.11:9010
      FE_ID: "1"
    volumes: [fe-meta:/opt/apache-doris/fe/doris-meta]
    networks:
      lab: {ipv4_address: 172.30.41.11}
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW FRONTENDS'"]
      interval: 5s
      timeout: 5s
      retries: 60
  be:
    build: {context: ., dockerfile: docker/Dockerfile.be}
    image: examples/doris-single-be:4.0.8
    cpus: 2
    mem_limit: 4g
    environment:
      FE_SERVERS: fe1:172.30.41.11:9010
      BE_ADDR: 172.30.41.21:9050
    volumes: [be-data:/opt/apache-doris/be/storage]
    networks:
      lab: {ipv4_address: 172.30.41.21}
    depends_on:
      fe: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9060'"]
      interval: 5s
      timeout: 5s
      retries: 60
  orders:
    build: orders-workload
    image: examples/doris-orders:1
    profiles: [tools]
    cpus: 1
    mem_limit: 256m
    networks: [lab]
    command: [verify]
volumes:
  fe-meta:
  be-data:
networks:
  lab:
    internal: true
    ipam:
      config: [{subnet: 172.30.41.0/24}]
