name: aerospike-cluster

# Three Aerospike CE nodes (CE clusters up to 8 nodes) with one
# aerospike-prometheus-exporter per node, plus Prometheus and Grafana.
x-aerospike: &aerospike
  image: aerospike/aerospike-server:${AEROSPIKE_VERSION:-8.1.2.5}
  # the entrypoint regenerates /etc/aerospike/aerospike.conf from its template,
  # so mount ours elsewhere and point asd at it
  command: ["asd", "--config-file", "/opt/aerospike/etc/aerospike.conf"]
  volumes:
    - ./aerospike.conf:/opt/aerospike/etc/aerospike.conf:ro

# AGENT_REFRESH_SYSTEM_STATS adds the host (Docker VM) stats the upstream dashboards chart
x-exporter: &exporter
  image: aerospike/aerospike-prometheus-exporter:1.35.0

services:
  aerospike-1:
    <<: *aerospike
    container_name: aerospike-1
    hostname: aerospike-1
    ports: ["3000:3000"]
  aerospike-2:
    <<: *aerospike
    container_name: aerospike-2
    hostname: aerospike-2
  aerospike-3:
    <<: *aerospike
    container_name: aerospike-3
    hostname: aerospike-3

  exporter-1:
    <<: *exporter
    container_name: aerospike-exporter-1
    environment: { AS_HOST: aerospike-1, AGENT_REFRESH_SYSTEM_STATS: "true" }
  exporter-2:
    <<: *exporter
    container_name: aerospike-exporter-2
    environment: { AS_HOST: aerospike-2, AGENT_REFRESH_SYSTEM_STATS: "true" }
  exporter-3:
    <<: *exporter
    container_name: aerospike-exporter-3
    environment: { AS_HOST: aerospike-3, AGENT_REFRESH_SYSTEM_STATS: "true" }

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: aerospike-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.2
    container_name: aerospike-grafana
    ports: ["3001:3000"] # 3000 is taken by aerospike-1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  # `make test` runs aql from here (the server image no longer ships it)
  tools:
    image: aerospike/aerospike-tools:${TOOLS_VERSION:-13.1.0}
    profiles: [tools]
    volumes:
      - ./aql:/aql:ro

  # `make benchmark`: asbench workloads (bench/run.sh), raw output to results/
  bench:
    image: aerospike/aerospike-tools:${TOOLS_VERSION:-13.1.0}
    profiles: [bench]
    cpus: ${BENCH_CLIENT_CPUS:-2}
    command: ["sh", "/bench/run.sh"]
    environment:
      NAME: ${NAME:-}
      DURATION: ${DURATION:-60}
      THREADS: ${THREADS:-16}
      KEYS: ${KEYS:-1000000}
      OBJECT_SPEC: ${OBJECT_SPEC:-B100}
    volumes:
      - ./bench:/bench:ro
      - ./results:/results

  # `make benchmark`: parses the raw output (bench/report.py) into a table and results/*.json
  bench-report:
    image: ghcr.io/astral-sh/uv:0.12.19-python3.13-trixie-slim
    profiles: [bench]
    working_dir: /bench
    command: ["uv", "run", "--frozen", "report.py"]
    environment:
      UV_CACHE_DIR: /uv/cache          # the venv lives in the uv volume, so reruns skip creating it
      UV_PROJECT_ENVIRONMENT: /uv/venv
      UV_PYTHON_DOWNLOADS: never       # use the image's Python
      NAME: ${NAME:-}
      TOOLS_VERSION: ${TOOLS_VERSION:-13.1.0}
      HOST_INFO: ${HOST_INFO:-}
      DOCKER_INFO: ${DOCKER_INFO:-}
      BENCH_LIMITS: ${BENCH_LIMITS:-}
    volumes:
      - ./bench:/bench:ro
      - ./results:/results
      - uv-cache:/uv

volumes:
  uv-cache:
