name: milvus-single

# Trimmed from upstream's milvus-standalone-docker-compose.yaml (v3.0.2):
# etcd holds metadata, MinIO holds segment/index files, `standalone` runs every Milvus role.
x-milvus-image: &milvus-image milvusdb/milvus:${MILVUS_VERSION:-v3.0.2}

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO no longer publishes community images (upstream's quay.io/minio tag now
  # returns 401); Chainguard's free build is `latest` only, so it is pinned by digest.
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    container_name: milvus-minio
    environment:
      MINIO_ROOT_USER: minioadmin # Milvus' default credentials
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  standalone:
    image: *milvus-image
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    ports: # localhost only: Milvus auth is off
      - "127.0.0.1:19530:19530" # gRPC + REST (/v2/vectordb)
      - "127.0.0.1:9091:9091"   # health, metrics, web UI (/webui)
    # upstream's milvus-volume-init chown service is omitted: named volumes inherit the image's ownership (uid 999)
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }

  # python + pymilvus, used by `make test` and `make cli`
  tools:
    build:
      dockerfile_inline: |
        FROM python:3.13-slim
        RUN pip install --no-cache-dir pymilvus==3.0.2
    profiles: [tools]
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro

  # uv + Python 3.13, used by `make benchmark` (bench/bench.py, deps pinned in bench/uv.lock)
  bench:
    image: ghcr.io/astral-sh/uv:0.12.19-python3.13-trixie-slim
    profiles: [bench]
    cpus: ${BENCH_CLIENT_CPUS:-2}
    working_dir: /bench
    command: ["uv", "run", "--frozen", "bench.py"]
    environment:
      BENCH_LIMITS: ${BENCH_LIMITS:-}      # bench/limits.sh, copied into the JSON
      UV_CACHE_DIR: /uv/cache              # wheel cache and venv live in the uv volume,
      UV_PROJECT_ENVIRONMENT: /uv/venv     # so reruns skip downloads and installs
      UV_PYTHON_DOWNLOADS: never           # use the image's Python
      SMOKE: ${SMOKE:-}
      N: ${N:-}
      DIM: ${DIM:-}
      K: ${K:-}
    volumes:
      - ./bench:/bench:ro
      - ./results:/results
      - uv-cache:/uv

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  uv-cache:
