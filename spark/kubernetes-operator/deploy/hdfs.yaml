apiVersion: v1
kind: Service
metadata:
  name: namenode
spec:
  selector: {app: hdfs-namenode}
  ports:
    - {name: rpc, port: 9000}
    - {name: http, port: 9870}
---
apiVersion: v1
kind: Service
metadata:
  name: namenode-headless
spec:
  clusterIP: None
  selector: {app: hdfs-namenode}
  ports:
    - {name: rpc, port: 9000}
---
apiVersion: v1
kind: Service
metadata:
  name: datanode
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: hdfs-datanode}
  ports:
    - {name: transfer, port: 9866}
    - {name: ipc, port: 9867}
    - {name: http, port: 9864}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: namenode
spec:
  serviceName: namenode-headless
  replicas: 1
  selector:
    matchLabels: {app: hdfs-namenode}
  template:
    metadata:
      labels: {app: hdfs-namenode}
    spec:
      securityContext: {runAsUser: 10000, runAsGroup: 10000, fsGroup: 10000}
      containers:
        - name: namenode
          image: examples/spark-hdfs-storage:3.5.0
          imagePullPolicy: Never
          args: [namenode]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /jmx, port: 9870}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /jmx, port: 9870}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - {name: metadata, mountPath: /data/name}
  volumeClaimTemplates:
    - metadata:
        name: metadata
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: datanode
spec:
  serviceName: datanode
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: hdfs-datanode}
  template:
    metadata:
      labels: {app: hdfs-datanode}
    spec:
      securityContext: {runAsUser: 10000, runAsGroup: 10000, fsGroup: 10000}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: hdfs-datanode}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: datanode
          image: examples/spark-hdfs-storage:3.5.0
          imagePullPolicy: Never
          args: [datanode]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /jmx, port: 9864}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /jmx, port: 9864}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - {name: blocks, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: blocks
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
