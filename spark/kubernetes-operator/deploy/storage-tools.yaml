apiVersion: v1
kind: Pod
metadata:
  name: hdfs-tools
spec:
  restartPolicy: Never
  containers:
    - name: tools
      image: examples/spark-hdfs-storage:3.5.0
      imagePullPolicy: Never
      command: [python3, -c, 'import time; time.sleep(86400)']
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "1", memory: 1Gi}
