apiVersion: batch/v1
kind: Job
metadata:
  name: parquet-verifier
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: parquet-verifier
          image: examples/spark-hdfs-verifier:26.0.1
          imagePullPolicy: Never
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
