Port 2222
ListenAddress 0.0.0.0
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
UsePAM no
AuthorizedKeysFile /lab-ssh/authorized_keys
StrictModes yes
AllowUsers hadoop
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
PrintMotd no
LogLevel VERBOSE
PidFile /run/sshd/sshd.pid
