apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: valkey
  namespace: valkey
spec:
  shards: 3
  replicas: 1
  # the operator defaults to valkey/valkey:9.0.0
  image: valkey/valkey:9.1.2
  config:
    maxmemory: 100mb
    maxmemory-policy: allkeys-lru
    appendonly: "yes"
    appendfsync: everysec
    cluster-node-timeout: "5000"
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m
  # can't be added, removed or shrunk after creation
  persistence:
    size: 1Gi
    storageClassName: standard
    reclaimPolicy: Delete
