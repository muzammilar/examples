name: redpanda-cluster

# Three Redpanda brokers (one Raft group per partition, RF=3 topics) plus Redpanda Console;
# redpanda-3 and redpanda-4 (profile `scale`) for 3 -> 5 -> 3.
# redpanda-0 starts the cluster (no --seeds); redpanda-1 and -2 join through it, as in the
# quickstart (https://docs.redpanda.com/current/get-started/quick-start/).
x-redpanda: &redpanda
  image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v26.2.3}
  healthcheck:
    test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -Eq 'Healthy:.+true'"]
    interval: 2s
    timeout: 5s
    retries: 60
    start_period: 5s


services:
  redpanda-0:
    <<: *redpanda
    container_name: redpanda-cc-0
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-0:9092,external://localhost:${REDPANDA_KAFKA_PORT_0:-19192}
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://redpanda-0:8082
      - --schema-registry-addr=internal://0.0.0.0:8081
      - --rpc-addr=redpanda-0:33145
      - --advertise-rpc-addr=redpanda-0:33145
      - --mode=dev-container
      - --smp=${REDPANDA_SMP:-1}
      - --memory=${REDPANDA_MEMORY:-1536M}
    ports:
      - "127.0.0.1:${REDPANDA_KAFKA_PORT_0:-19192}:19092"
      - "127.0.0.1:${REDPANDA_ADMIN_PORT_0:-19744}:9644"
    volumes: [redpanda-0:/var/lib/redpanda/data]

  redpanda-1:
    <<: *redpanda
    container_name: redpanda-cc-1
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-1:9092,external://localhost:${REDPANDA_KAFKA_PORT_1:-19193}
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://redpanda-1:8082
      - --schema-registry-addr=internal://0.0.0.0:8081
      - --rpc-addr=redpanda-1:33145
      - --advertise-rpc-addr=redpanda-1:33145
      - --seeds=redpanda-0:33145
      - --mode=dev-container
      - --smp=${REDPANDA_SMP:-1}
      - --memory=${REDPANDA_MEMORY:-1536M}
    ports:
      - "127.0.0.1:${REDPANDA_KAFKA_PORT_1:-19193}:19092"
      - "127.0.0.1:${REDPANDA_ADMIN_PORT_1:-19745}:9644"
    volumes: [redpanda-1:/var/lib/redpanda/data]
    depends_on: { redpanda-0: { condition: service_healthy } }

  redpanda-2:
    <<: *redpanda
    container_name: redpanda-cc-2
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-2:9092,external://localhost:${REDPANDA_KAFKA_PORT_2:-19194}
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://redpanda-2:8082
      - --schema-registry-addr=internal://0.0.0.0:8081
      - --rpc-addr=redpanda-2:33145
      - --advertise-rpc-addr=redpanda-2:33145
      - --seeds=redpanda-0:33145
      - --mode=dev-container
      - --smp=${REDPANDA_SMP:-1}
      - --memory=${REDPANDA_MEMORY:-1536M}
    ports:
      - "127.0.0.1:${REDPANDA_KAFKA_PORT_2:-19194}:19092"
      - "127.0.0.1:${REDPANDA_ADMIN_PORT_2:-19746}:9644"
    volumes: [redpanda-2:/var/lib/redpanda/data]
    depends_on: { redpanda-0: { condition: service_healthy } }

  # `make scale-out` adds redpanda-3 and redpanda-4; `make scale-in` decommissions and removes them
  redpanda-3:
    <<: *redpanda
    container_name: redpanda-cc-3
    profiles: [scale]
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda-3:9092
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://redpanda-3:8082
      - --schema-registry-addr=internal://0.0.0.0:8081
      - --rpc-addr=redpanda-3:33145
      - --advertise-rpc-addr=redpanda-3:33145
      - --seeds=redpanda-0:33145
      - --mode=dev-container
      - --smp=${REDPANDA_SMP:-1}
      - --memory=${REDPANDA_MEMORY:-1536M}
    volumes: [redpanda-3:/var/lib/redpanda/data]
    depends_on: { redpanda-0: { condition: service_healthy } }

  redpanda-4:
    <<: *redpanda
    container_name: redpanda-cc-4
    profiles: [scale]
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda-4:9092
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://redpanda-4:8082
      - --schema-registry-addr=internal://0.0.0.0:8081
      - --rpc-addr=redpanda-4:33145
      - --advertise-rpc-addr=redpanda-4:33145
      - --seeds=redpanda-0:33145
      - --mode=dev-container
      - --smp=${REDPANDA_SMP:-1}
      - --memory=${REDPANDA_MEMORY:-1536M}
    volumes: [redpanda-4:/var/lib/redpanda/data]
    depends_on: { redpanda-0: { condition: service_healthy } }

  console:
    image: docker.redpanda.com/redpandadata/console:${CONSOLE_VERSION:-v3.12.0}
    container_name: redpanda-cc-console
    entrypoint: ["/bin/sh", "-c", 'echo "$$CONSOLE_CONFIG" > /tmp/config.yml && exec ./console']
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG: |
        kafka:
          brokers: ["redpanda-0:9092", "redpanda-1:9092", "redpanda-2:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081", "http://redpanda-1:8081", "http://redpanda-2:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644", "http://redpanda-1:9644", "http://redpanda-2:9644"]
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      redpanda-0: { condition: service_healthy }
      redpanda-1: { condition: service_healthy }
      redpanda-2: { condition: service_healthy }

  # `make failover` / `make load`: client/ (Go, franz-go), acks=all idempotent producer at a
  # fixed rate, then reads the topic back and checks every acknowledged record is there
  load:
    build: client
    image: redpanda-cluster-load
    profiles: [tools]
    environment:
      BROKERS: redpanda-0:9092,redpanda-1:9092,redpanda-2:9092
      TOPIC: ${TOPIC:-failover}
      PARTITIONS: ${PARTITIONS:-6}
      REPLICAS: 3
      RATE: ${RATE:-5000}
      DURATION: ${DURATION:-60s}
      RECORD_SIZE: ${RECORD_SIZE:-512}
      METADATA_MIN_AGE: ${METADATA_MIN_AGE:-5s}

volumes:
  redpanda-0:
  redpanda-1:
  redpanda-2:
  redpanda-3:
  redpanda-4:
