name: iceberg-trino-minio
x-minio: &minio
  image: iceberg-minio:dev
  build: ./minio
  command: [server, 'http://minio{1...4}/data', --console-address, ':9001']
  environment:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minio-local-password
  healthcheck:
    test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/ready]
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 15s
services:
  minio1:
    <<: *minio
    hostname: minio1
    volumes:
      - minio1:/data
  minio2:
    <<: *minio
    hostname: minio2
    volumes:
      - minio2:/data
  minio3:
    <<: *minio
    hostname: minio3
    volumes:
      - minio3:/data
  minio4:
    <<: *minio
    hostname: minio4
    volumes:
      - minio4:/data
  minio:
    image: haproxy:3.2.4-alpine
    volumes:
      - ./minio/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:9000"
    depends_on:
      minio1: {condition: service_healthy}
      minio2: {condition: service_healthy}
      minio3: {condition: service_healthy}
      minio4: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8404/]
      interval: 3s
      timeout: 3s
      retries: 60
  buckets:
    image: iceberg-minio:dev
    build: ./minio
    entrypoint: [sh, -c]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minio-local-password &&
        mc mb --ignore-existing local/warehouse local/exchange
    depends_on:
      minio: {condition: service_healthy}
  catalog-volume:
    image: busybox:1.37.0
    user: '0:0'
    command: [chown, '1000:1000', /catalog]
    volumes:
      - catalog:/catalog
  catalog:
    image: apache/iceberg-rest-fixture:1.10.1
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minio-local-password
      AWS_REGION: us-east-1
      CATALOG_URI: jdbc:sqlite:/catalog/catalog.db?journal_mode=WAL
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
    volumes:
      - catalog:/catalog
    depends_on:
      buckets: {condition: service_completed_successfully}
      catalog-volume: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8181/v1/config]
      interval: 3s
      timeout: 5s
      retries: 60
  coordinator:
    image: trinodb/trino:484
    hostname: coordinator
    volumes:
      - ./trino/coordinator.properties:/etc/trino/config.properties:ro
      - ./trino/coordinator-node.properties:/etc/trino/node.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    depends_on:
      catalog: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 20s
    ports:
      - "127.0.0.1:${TRINO_PORT:-18080}:8080"
  worker1:
    image: trinodb/trino:484
    hostname: worker1
    volumes:
      - ./trino/worker.properties:/etc/trino/config.properties:ro
      - ./trino/worker1-node.properties:/etc/trino/node.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    depends_on:
      catalog: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 20s
  worker2:
    image: trinodb/trino:484
    hostname: worker2
    volumes:
      - ./trino/worker.properties:/etc/trino/config.properties:ro
      - ./trino/worker2-node.properties:/etc/trino/node.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    depends_on:
      catalog: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 20s
  worker3:
    image: trinodb/trino:484
    hostname: worker3
    volumes:
      - ./trino/worker.properties:/etc/trino/config.properties:ro
      - ./trino/worker3-node.properties:/etc/trino/node.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/exchange-manager.properties:/etc/trino/exchange-manager.properties:ro
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    depends_on:
      catalog: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 20s
  client:
    profiles: [tools]
    image: iceberg-trino-client:dev
    build: ./client
    environment:
      COUNT: ${COUNT:-1000000}
      HISTORY_QUERIES: ${HISTORY_QUERIES:-20}
      CUSTOMERS: ${CUSTOMERS:-10000}
      AMPLIFY: ${AMPLIFY:-256}
      RUN_ID: ${RUN_ID:-manual}
      TRINO_URL: http://coordinator:8080
    volumes:
      - ./results:/results
volumes:
  minio1:
  minio2:
  minio3:
  minio4:
  catalog:
