global
  log stdout format raw local0
defaults
  mode tcp
  timeout connect 3s
  timeout client 5m
  timeout server 5m
frontend s3
  bind *:9000
  default_backend minio
backend minio
  balance roundrobin
  option httpchk
  http-check send meth GET uri /minio/health/ready ver HTTP/1.1 hdr Host minio
  http-check expect status 200
  server minio1 minio1:9000 check inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
  server minio2 minio2:9000 check inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
  server minio3 minio3:9000 check inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
  server minio4 minio4:9000 check inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
frontend health
  mode http
  bind *:8404
  http-request return status 200 if { nbsrv(minio) ge 3 }
  http-request return status 503
