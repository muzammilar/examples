# Global config
global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # franz-go client metrics (kprom plugin) exposed by the producers
  - job_name: "treeproducer"
    static_configs:
      - targets:
          - "producertree:8080"
          - "producertest:8080"

  # docker DNS returns one A record per replica, so scaling the consumers is picked up automatically
  - job_name: "treeconsumer"
    dns_sd_configs:
      - names: ["consumer"]
        type: A
        port: 8080
        refresh_interval: 15s
