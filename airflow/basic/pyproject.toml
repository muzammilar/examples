[project]
name = "airflow-basic"
version = "0.1.0"
description = "DAGs for the Airflow Docker Compose example, with local tests"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Same Airflow as the image in docker-compose.yaml, so DAGs are tested against what runs them.
dependencies = ["apache-airflow==3.3.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[tool.uv]
package = false # dags/ is mounted into the containers, not installed

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["logs", "config", "plugins"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "AIR"]
