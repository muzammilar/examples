# Turns Airflow's dotted StatsD names into Prometheus metrics with labels.
# Metric reference: https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/metrics.html
# Anything not matched here is still exported, with dots replaced by underscores (e.g. airflow_scheduler_heartbeat).
mappings:
  - match: "airflow.dagrun.duration.*.*"
    name: "airflow_dagrun_duration"
    labels: {state: "$1", dag_id: "$2"}
  - match: "airflow.dagrun.schedule_delay.*"
    name: "airflow_dagrun_schedule_delay"
    labels: {dag_id: "$1"}
  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration"
    labels: {dag_id: "$1", task_id: "$2"}
  - match: "airflow.dag.*.*.queued_duration"
    name: "airflow_task_queued_duration"
    labels: {dag_id: "$1", task_id: "$2"}
  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_ti_finish"
    labels: {dag_id: "$1", task_id: "$2", state: "$3"}
  - match: "airflow.ti.start.*.*"
    name: "airflow_ti_start"
    labels: {dag_id: "$1", task_id: "$2"}
  - match: "airflow.pool.*.*"
    name: "airflow_pool_${1}"
    labels: {pool: "$2"}
  - match: "airflow.dag_processing.last_duration.*"
    name: "airflow_dag_processing_last_duration"
    labels: {file: "$1"}
  - match: "airflow.dag_processing.last_run.seconds_ago.*"
    name: "airflow_dag_processing_last_run_seconds_ago"
    labels: {file: "$1"}
