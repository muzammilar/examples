name: rayforce-duckdb-comparison
services:
  analytics:
    image: rayforce-duckdb-analytics:dev
    build: ./.build
    cpus: ${CPUS:-1}
    mem_limit: 4g
    memswap_limit: 4g
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m
    volumes:
      - ./results/data:/data:ro
      - ./results/plans:/plans:ro
    profiles: [tools]

  ingestion:
    extends:
      service: analytics
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: {HOME: /tmp, RAYFORCE_NO_FSYNC: "0"}
    volumes:
      - "${VERIFICATION_PATH:-./results/unused}:/verification"
