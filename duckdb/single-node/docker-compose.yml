name: duckdb-single

# DuckDB is an in-process database: no server, just one-shot containers that read
# and write files in ./data (run as the host user so ./data stays removable).
services:
  # stdlib-only data generator: events.csv, users.json (NDJSON), countries.csv
  gen:
    image: python:${PYTHON_VERSION:-3.13-slim}
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work
    command: python scripts/generate.py /data
    volumes:
      - ./scripts:/work/scripts:ro
      - ./data:/data

  # the official image is just the static duckdb binary (no shell)
  duckdb:
    image: duckdb/duckdb:${DUCKDB_VERSION:-1.5.5}
    entrypoint: ["/duckdb"]
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp # duckdb keeps ~/.duckdb (history, extensions) here
    working_dir: /data
    volumes:
      - ./data:/data

  # `make benchmark`: the same binary, reading the script generated by bench/tpch.sh on
  # stdin and writing results/duckdb-<timestamp>.json; capped at BENCH_CPUS / BENCH_MEM
  bench:
    image: duckdb/duckdb:${DUCKDB_VERSION:-1.5.5}
    cpus: ${BENCH_CPUS:-4}
    mem_limit: ${BENCH_MEM:-6g}
    memswap_limit: ${BENCH_MEM:-6g}
    entrypoint: ["/duckdb"]
    profiles: [bench]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /data
    volumes:
      - ./data:/data
      - ./results:/results
