name: duckdb-single

# DuckDB is an in-process database: no server, just one-shot containers that read
# and write files in ./data (run as the host user so ./data stays removable).
services:
  # stdlib-only data generator: events.csv, users.json (NDJSON), countries.csv
  gen:
    image: python:${PYTHON_VERSION:-3.13-slim}
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work
    command: python scripts/generate.py /data
    volumes:
      - ./scripts:/work/scripts:ro
      - ./data:/data

  # the official image is just the static duckdb binary (no shell)
  duckdb:
    image: duckdb/duckdb:${DUCKDB_VERSION:-1.5.5}
    entrypoint: ["/duckdb"]
    profiles: [tools]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp # duckdb keeps ~/.duckdb (history, extensions) here
    working_dir: /data
    volumes:
      - ./data:/data
      - ./sql:/sql:ro
