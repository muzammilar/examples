name: kdb-markets

# One kdb+ q process (as in ../single-node) and the C++ showcase client (showcase/, KX C API).
# The server needs the kdb+ license (KDB_LICENSE_B64 / ../license), see ../README.md; the client
# does not. Host port KDB_PORT (default 5102).
services:
  kdb:
    build:
      context: ../image
      args:
        KDB_DIST: ${KDB_DIST:-kdb+}
        KDB_VERSION: ${KDB_VERSION:-4.1/2026.10.02}
        KDB_X_VERSION: ${KDB_X_VERSION:-5.0.20261002}
    container_name: kdb-markets
    # -s 4: secondary threads (KDB-X Community Edition maximum)
    command: ["q", "-p", "5000", "-s", "4"]
    environment:
      KDB_LICENSE_B64: ${KDB_LICENSE_B64:-}
      KDB_LICENSE_K4B64: ${KDB_LICENSE_K4B64:-}
    ports:
      - "${KDB_PORT:-5102}:5000"
    volumes:
      - ../license:/license:ro
    # q has no health endpoint; a TCP connect means the listener is up (after the license check)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 2s
      timeout: 2s
      retries: 30

  # `make run`: showcase/main.cpp, built against k.h + c.o
  showcase:
    build: showcase
    profiles: [run]
    environment:
      KDB_HOST: kdb
      KDB_PORT: "5000"
      TRADES: ${TRADES:-20000000}
      QUOTES_PER_TRADE: ${QUOTES_PER_TRADE:-2}
      SYMS: ${SYMS:-100}
      BATCH: ${BATCH:-1000000}
    depends_on:
      kdb: { condition: service_healthy }
