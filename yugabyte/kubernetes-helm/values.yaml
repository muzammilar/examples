# Overrides for yugabytedb/yugabyte sized for a laptop kind cluster
# (chart defaults: 2 CPU / 2-4 GiB and 2x10 GiB volumes per pod).
replicas:
  master: 3
  tserver: 3

# Memory limits must be whole Gi: the chart derives memory_limit_hard_bytes from them.
resource:
  master:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  tserver:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }

storage:
  master: { count: 1, size: 1Gi, storageClass: standard }
  tserver: { count: 1, size: 2Gi, storageClass: standard }

# kind has no LoadBalancer implementation; use port-forward instead.
enableLoadBalancer: false
