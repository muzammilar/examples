global:
  scrape_interval: 15s

# Labels and relabeling from the upstream dashboard's README
# (yugabyte-db cloud/grafana): node_prefix names the cluster, export_type the
# server, and handler_latency_<server>_<service>_<method>{_sum,_count} becomes
# rpc_latency{_sum,_count} with server_type/service_type/service_method labels
# and the original name kept in saved_name.
scrape_configs:
  - job_name: yb-master
    metrics_path: /prometheus-metrics
    relabel_configs: &node_prefix
      - target_label: node_prefix
        replacement: yugabyte-cluster
    metric_relabel_configs: &rpc_latency
      - source_labels: [__name__]
        regex: "(.*)"
        target_label: saved_name
        replacement: "$1"
      - source_labels: [__name__]
        regex: "handler_latency_(yb_[^_]*)_([^_]*)_([^_]*)(.*)"
        target_label: server_type
        replacement: "$1"
      - source_labels: [__name__]
        regex: "handler_latency_(yb_[^_]*)_([^_]*)_([^_]*)(.*)"
        target_label: service_type
        replacement: "$2"
      - source_labels: [__name__]
        regex: "handler_latency_(yb_[^_]*)_([^_]*)_([^_]*)(_sum|_count)?"
        target_label: service_method
        replacement: "$3"
      - source_labels: [__name__]
        regex: "handler_latency_(yb_[^_]*)_([^_]*)_([^_]*)(_sum|_count)?"
        target_label: __name__
        replacement: "rpc_latency$4"
    static_configs:
      - targets: ["yb-1:7000", "yb-2:7000", "yb-3:7000"]
        labels: { export_type: master_export }
  - job_name: yb-tserver
    metrics_path: /prometheus-metrics
    relabel_configs: *node_prefix
    metric_relabel_configs: *rpc_latency
    static_configs:
      - targets: ["yb-1:9000", "yb-2:9000", "yb-3:9000"]
        labels: { export_type: tserver_export }
  # YSQL (postgres) and YCQL query-layer metrics
  - job_name: ysql
    metrics_path: /prometheus-metrics
    relabel_configs: *node_prefix
    metric_relabel_configs: *rpc_latency
    static_configs:
      - targets: ["yb-1:13000", "yb-2:13000", "yb-3:13000"]
        labels: { export_type: ysql_export }
  - job_name: ycql
    metrics_path: /prometheus-metrics
    relabel_configs: *node_prefix
    metric_relabel_configs: *rpc_latency
    static_configs:
      - targets: ["yb-1:12000", "yb-2:12000", "yb-3:12000"]
        labels: { export_type: cql_export }
