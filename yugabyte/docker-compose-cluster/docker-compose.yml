name: yugabyte-cluster

# Three yugabyted nodes, one per (simulated) zone. yb-1 starts the universe; yb-2
# and yb-3 `--join` it one after another (depends_on + healthcheck). Once the
# third node joins, yugabyted raises the replication factor to 3; `make up`
# then runs `yugabyted configure data_placement` to spread replicas across zones.
# Data lives in each container's layer (the image runs as uid 10001, so fresh
# named volumes would be root-owned); `make down` discards it.
# The image is multi-arch (amd64 + arm64), so it runs natively on Apple silicon.
x-yb: &yb
  image: yugabytedb/yugabyte:${YB_VERSION:-2026.1.2.0-b137}
  healthcheck:
    test: ["CMD-SHELL", "ysqlsh -h $$(hostname) -c 'SELECT 1' && ycqlsh $$(hostname) -e 'SELECT now() FROM system.local'"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 30s

services:
  yb-1:
    <<: *yb
    container_name: yb-1
    hostname: yb-1
    command: >-
      bin/yugabyted start --background=false
      --cloud_location=docker.local.zone1
    ports:
      - "5433:5433"   # YSQL
      - "9042:9042"   # YCQL
      - "15433:15433" # yugabyted UI
      - "7000:7000"   # yb-master UI
      - "9000:9000"   # yb-tserver UI
    volumes: [./ysql:/ysql:ro, ./ycql:/ycql:ro, ./failover:/failover:ro]
  yb-2:
    <<: *yb
    container_name: yb-2
    hostname: yb-2
    command: >-
      bin/yugabyted start --background=false
      --cloud_location=docker.local.zone2 --join=yb-1
    depends_on:
      yb-1: { condition: service_healthy }
  yb-3:
    <<: *yb
    container_name: yb-3
    hostname: yb-3
    command: >-
      bin/yugabyted start --background=false
      --cloud_location=docker.local.zone3 --join=yb-1
    depends_on:
      yb-2: { condition: service_healthy }

  # yb-master (:7000) and yb-tserver (:9000) serve Prometheus text at /prometheus-metrics.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: yb-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.2
    container_name: yb-grafana
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  # `make benchmark`: ysql_bench (YugabyteDB's pgbench) runs (bench/run.sh), raw output to results/
  bench:
    image: yugabytedb/yugabyte:${YB_VERSION:-2026.1.2.0-b137}
    profiles: [bench]
    entrypoint: ["bash", "/bench/run.sh"]
    environment:
      NAME: ${NAME:-}
      DURATION: ${DURATION:-60}
      CLIENTS: ${CLIENTS:-1 8 16}
      SCALE: ${SCALE:-10}
      MAX_TRIES: ${MAX_TRIES:-10}
    volumes:
      - ./bench:/bench:ro
      - ./results:/results

  # `make benchmark`: parses the raw output (bench/report.py) into a table and results/*.json
  bench-report:
    image: ghcr.io/astral-sh/uv:0.12.19-python3.13-trixie-slim
    profiles: [bench]
    working_dir: /bench
    command: ["uv", "run", "--frozen", "report.py"]
    environment:
      UV_CACHE_DIR: /uv/cache          # the venv lives in the uv volume, so reruns skip creating it
      UV_PROJECT_ENVIRONMENT: /uv/venv
      UV_PYTHON_DOWNLOADS: never       # use the image's Python
      NAME: ${NAME:-}
      HOST_INFO: ${HOST_INFO:-}
      DOCKER_INFO: ${DOCKER_INFO:-}
    volumes:
      - ./bench:/bench:ro
      - ./results:/results
      - uv-cache:/uv

volumes:
  uv-cache:
