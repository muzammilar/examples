# Operator RBAC, from
# https://docs.singlestore.com/db/v9.0/deploy/kubernetes/create-the-object-definition-files/sdb-rbac-yaml/
# (namespace set to "singlestore"; applied with `kubectl -n singlestore`)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sdb-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sdb-operator
rules:
- apiGroups: [""]
  resources: [pods, services, endpoints, persistentvolumeclaims, events, configmaps, secrets]
  verbs: ["*"]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: ["*"]
- apiGroups: [batch]
  resources: [cronjobs]
  verbs: ["*"]
- apiGroups: [""]
  resources: [namespaces]
  verbs: [get]
- apiGroups: [apps, extensions]
  resources: [deployments, daemonsets, replicasets, statefulsets, statefulsets/status]
  verbs: ["*"]
- apiGroups: [memsql.com]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: ["*"]
- apiGroups: [""]
  resources: [serviceaccounts]
  verbs: [get, watch, list]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: ["*"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sdb-operator
subjects:
- kind: ServiceAccount
  name: sdb-operator
roleRef:
  kind: Role
  name: sdb-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sdb-operator
rules:
- apiGroups: [storage.k8s.io]
  resources: [storageclasses]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [persistentvolumes, nodes]
  verbs: [get, list, watch]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sdb-operator
subjects:
- kind: ServiceAccount
  name: sdb-operator
  namespace: singlestore
roleRef:
  kind: ClusterRole
  name: sdb-operator
  apiGroup: rbac.authorization.k8s.io
