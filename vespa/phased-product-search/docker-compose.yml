name: vespa-phased-product-search
x-node: &node
  image: vespaengine/vespa:8.781.11
  command: configserver,services
  cpus: 2
  mem_limit: ${CONTROL_MEMORY:-4g}
  environment:
    # The image defaults to a 4 GiB startup floor. Sharded mode separates
    # roles into small lab hosts; keep cgroup limits and feed guards enabled.
    VESPA_IGNORE_NOT_ENOUGH_MEMORY: ${IGNORE_MEMORY_FLOOR:-false}
    VESPA_CONFIGSERVERS: ${CONFIGSERVERS:-vespa-products-node0.vespa-product-search-net,vespa-products-node1.vespa-product-search-net,vespa-products-node2.vespa-product-search-net}
    VESPA_CONFIGSERVER_JVMARGS: -Xms32M -Xmx256M
    VESPA_CONFIGPROXY_JVMARGS: -Xms32M -Xmx64M
  healthcheck:
    test: [CMD, curl, -fsS, http://localhost:19071/state/v1/health]
    interval: 5s
    timeout: 3s
    retries: 90
    start_period: 30s
# Content-only hosts do not run a config server. The native RPC ping works
# before application deployment; the client separately waits for query coverage.
x-content: &content
  <<: *node
  command: services
  cpus: 1
  mem_limit: 1536m
  profiles: [sharded]
  healthcheck:
    test: [CMD, /opt/vespa/bin/vespa-ping-configproxy, -w, '2']
    interval: 5s
    timeout: 3s
    retries: 90
    start_period: 20s
services:
  node0:
    <<: *node
    container_name: vespa-products-node0
    hostname: vespa-products-node0.vespa-product-search-net
    volumes: [node0:/opt/vespa/var]
  node1:
    <<: *node
    container_name: vespa-products-node1
    hostname: vespa-products-node1.vespa-product-search-net
    profiles: [cluster, sharded]
    volumes: [node1:/opt/vespa/var]
  node2:
    <<: *node
    container_name: vespa-products-node2
    hostname: vespa-products-node2.vespa-product-search-net
    profiles: [cluster, sharded]
    volumes: [node2:/opt/vespa/var]
  content0:
    <<: *content
    container_name: vespa-products-content0
    hostname: vespa-products-content0.vespa-product-search-net
    volumes: [content0:/opt/vespa/var]
  content1:
    <<: *content
    container_name: vespa-products-content1
    hostname: vespa-products-content1.vespa-product-search-net
    volumes: [content1:/opt/vespa/var]
  content2:
    <<: *content
    container_name: vespa-products-content2
    hostname: vespa-products-content2.vespa-product-search-net
    volumes: [content2:/opt/vespa/var]
  content3:
    <<: *content
    container_name: vespa-products-content3
    hostname: vespa-products-content3.vespa-product-search-net
    volumes: [content3:/opt/vespa/var]
  content4:
    <<: *content
    container_name: vespa-products-content4
    hostname: vespa-products-content4.vespa-product-search-net
    volumes: [content4:/opt/vespa/var]
  content5:
    <<: *content
    container_name: vespa-products-content5
    hostname: vespa-products-content5.vespa-product-search-net
    volumes: [content5:/opt/vespa/var]
  content6:
    <<: *content
    container_name: vespa-products-content6
    hostname: vespa-products-content6.vespa-product-search-net
    volumes: [content6:/opt/vespa/var]
  content7:
    <<: *content
    container_name: vespa-products-content7
    hostname: vespa-products-content7.vespa-product-search-net
    volumes: [content7:/opt/vespa/var]
  content8:
    <<: *content
    container_name: vespa-products-content8
    hostname: vespa-products-content8.vespa-product-search-net
    volumes: [content8:/opt/vespa/var]
  corpus:
    profiles: [tools]
    image: vespa-products-corpus:dev
    build: ./.build/corpus
    environment:
      HOME: /cache
      DOCUMENTS: ${DOCUMENTS:-100000}
      QUERIES: ${QUERIES:-1000}
      SEED: ${SEED:-20261115}
    volumes:
      - ./results/corpus/cache:/cache
      - ./results/corpus/prepared:/prepared
    mem_limit: 8g
    cpus: 4
  tools:
    image: vespa-product-tools:dev
    build: ./.build/tools
    profiles: [tools]
    cpus: 2
    mem_limit: 3g
    environment:
      MODE: ${MODE:-cluster}
      URLS: ${URLS:-http://node0:8080,http://node1:8080,http://node2:8080}
      BENCH_QUERIES: ${BENCH_QUERIES:-1000}
      QUALITY_QUERIES: ${QUALITY_QUERIES:-100}
      CHECK_QUERIES: ${CHECK_QUERIES:-50}
      DURATION: ${DURATION:-300}
    volumes:
      - ./results/corpus/prepared:/corpus:ro
      - ./application/generated:/application:ro
      - ./${RESULTS_DIR:-results/cluster}:/results
  inventory-workload:
    image: vespa-inventory-workload:dev
    build: ./.build/inventory-workload
    profiles: [tools]
    cpus: 1
    mem_limit: 512m
    environment:
      MODE: ${MODE:-cluster}
      DURATION_SECONDS: ${DURATION_SECONDS:-1800}
      UPDATE_BATCH: ${UPDATE_BATCH:-10}
      UPDATE_CONCURRENCY: ${UPDATE_CONCURRENCY:-4}
    volumes:
      - ./results/corpus/prepared:/corpus:ro
      - ./${RESULTS_DIR:-results/production/cluster}:/results
volumes:
  node0:
  node1:
  node2:
  content0:
  content1:
  content2:
  content3:
  content4:
  content5:
  content6:
  content7:
  content8:

networks:
  default:
    name: vespa-product-search-net
