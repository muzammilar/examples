# Global config
global:
  scrape_interval: 5s # Set the scrape interval to every 5 seconds. Default is every 1 minute.
  evaluation_interval: 5s # Evaluate rules every 5 seconds. The default is every 1 minute.

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Every ClickHouse container of this compose project, including nodes added at runtime with
  # `make add-node`, found through the docker API instead of a static target list.
  - job_name: "clickhouse-server"
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=ch-discovery"]
    relabel_configs:
      # keep only the ClickHouse containers
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: "clickhouse-.*"
        action: keep
      # docker_sd emits one target per port (only the published ones if a container publishes any), so
      # don't filter on port: point every entry at the metrics port and identical targets are deduplicated.
      # instance = container name (clickhouse-server-01:8001), same as the hostname it registers with
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: __address__
        replacement: "$1:8001"
      - source_labels: [__address__]
        target_label: instance
