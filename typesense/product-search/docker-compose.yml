name: typesense-product-search
services:
  ts1:
    image: typesense-products-server:dev
    build: ./server
    hostname: ts1
    command: ["--data-dir=/data", "--api-key=local-search-key", "--nodes=/etc/typesense/nodes", "--peering-address=${NETWORK_PREFIX:-172.30.61}.11", "--api-port=8108", "--peering-port=8107"]
    volumes: [ts1:/data, ./config/generated/nodes:/etc/typesense/nodes:ro]
    mem_limit: 2g
    cpus: 2
    networks:
      default: {ipv4_address: '${NETWORK_PREFIX:-172.30.61}.11'}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8108/health]
      interval: 3s
      timeout: 5s
      retries: 120
      start_period: 20s
  ts2:
    image: typesense-products-server:dev
    build: ./server
    hostname: ts2
    profiles: [cluster, sharded]
    command: ["--data-dir=/data", "--api-key=local-search-key", "--nodes=/etc/typesense/nodes", "--peering-address=${NETWORK_PREFIX:-172.30.61}.12", "--api-port=8108", "--peering-port=8107"]
