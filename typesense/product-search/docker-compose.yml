  tools:
    profiles: [tools]
    image: typesense-product-tools:dev
    build: {context: ../.., dockerfile: typesense/product-search/app/Dockerfile}
    environment:
      MODE: ${MODE:-cluster}
      URLS: ${URLS:-http://ts1:8108,http://ts2:8108,http://ts3:8108}
      BENCH_QUERIES: ${BENCH_QUERIES:-1000}
      QUALITY_QUERIES: ${QUALITY_QUERIES:-100}
      CHECK_QUERIES: ${CHECK_QUERIES:-50}
      DURATION: ${DURATION:-75}
    volumes:
      - ${CORPUS_DIR:-../../datasets/esci/prepared}:/corpus:ro
      - ./${RESULTS_DIR:-results/manual}:/results
    mem_limit: 3g
    cpus: 2
networks:
  default:
    ipam:
      config: [{subnet: '${NETWORK_PREFIX:-172.30.61}.0/24'}]
volumes:
  ts1:
  ts2:
  ts3:
  ts4:
  ts5:
  ts6:
  ts7:
  ts8:
  ts9:
