# One worker per zone: mirror-3-dc needs three fail realms.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ydb-operator
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: az-1
  - role: worker
    labels:
      topology.kubernetes.io/zone: az-2
  - role: worker
    labels:
      topology.kubernetes.io/zone: az-3
