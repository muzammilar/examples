# Shared by nats-1..3; SERVER_NAME comes from each container's environment.
server_name: $SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
}

# Full mesh of routes; a server skips the route to itself.
cluster {
  name: demo
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats-1:6222
    nats-route://nats-2:6222
    nats-route://nats-3:6222
  ]
}

# APP holds the data (JetStream enabled); clients without credentials land in it.
# SYS is the system account: `nats server ...` commands need its user.
accounts {
  SYS: { users: [ { user: sys, password: sys } ] }
  APP: { jetstream: enabled, users: [ { user: app, password: app } ] }
}
system_account: SYS
no_auth_user: app
