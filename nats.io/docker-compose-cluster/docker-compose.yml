name: nats-cluster

# Three nats-server nodes routed into cluster "demo", JetStream on all of them.
x-nats: &nats
  # alpine variant: the default scratch image has no shell/wget for a healthcheck
  image: nats:${NATS_VERSION:-2.15.0-alpine}
  command: --config /etc/nats/nats.conf
  healthcheck:
    # /healthz is only ok once the server has JetStream up and is current with the meta group
    test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
    interval: 2s
    timeout: 2s
    retries: 60

services:
  nats-1:
    <<: *nats
    container_name: nats-1
    hostname: nats-1
    environment:
      SERVER_NAME: nats-1
    ports:
      - "127.0.0.1:4223:4222" # clients
      - "127.0.0.1:8223:8222" # HTTP monitoring
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-1-data:/data

  nats-2:
    <<: *nats
    container_name: nats-2
    hostname: nats-2
    environment:
      SERVER_NAME: nats-2
    ports:
      - "127.0.0.1:4224:4222"
      - "127.0.0.1:8224:8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-2-data:/data

  nats-3:
    <<: *nats
    container_name: nats-3
    hostname: nats-3
    environment:
      SERVER_NAME: nats-3
    ports:
      - "127.0.0.1:4225:4222"
      - "127.0.0.1:8225:8222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-3-data:/data

  # `make test` / `make failover` / `make cli` run the nats CLI from here; the client
  # knows all three servers and reconnects to another one if its server goes away
  tools:
    image: natsio/nats-box:${NATS_BOX_VERSION:-0.20.0}
    profiles: [tools]
    environment:
      NATS_URL: nats://nats-1:4222,nats://nats-2:4222,nats://nats-3:4222
    volumes:
      - ./scripts:/scripts:ro
      - ./failover:/failover:ro

volumes:
  nats-1-data:
  nats-2-data:
  nats-3-data:
