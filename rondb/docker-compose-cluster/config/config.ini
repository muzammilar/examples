# RonDB cluster configuration, read by the management server (ndb_mgmd) and handed
# out to every data node and API node that connects to it. Based on rondb-docker's
# resources/config_templates/config.ini with its "mini" machine-size values.

[NDBD DEFAULT]
# Two data nodes form one node group; each holds a full replica of every fragment.
NoOfReplicas=2
DataDir=/srv/hops/mysql-cluster/log
FileSystemPath=/srv/hops/mysql-cluster/ndb_data
BackupDataDir=/srv/hops/mysql-cluster/ndb/backups
# RonDB sizes threads and memory itself; cap it so both data nodes fit a laptop
# (by default a data node takes the whole VM it runs on).
AutomaticThreadConfig=true
AutomaticMemoryConfig=true
NumCPUs=2
TotalMemoryConfig=2100M
MaxNoOfTables=128
MaxNoOfAttributes=4000
MaxNoOfOrderedIndexes=128
MaxNoOfUniqueHashIndexes=64
MaxNoOfTriggers=1000
TransactionMemory=150M
SharedGlobalMemory=150M
ReservedConcurrentOperations=20000
MaxNoOfConcurrentOperations=100000
# small redo log (log parts x 4 files x 16M) instead of the 64 GB production default
NoOfFragmentLogFiles=4
FragmentLogFileSize=16M
RedoBuffer=16M
# shared, oversubscribed CPUs: sleep instead of spinning
SpinMethod=StaticSpinning

[TCP DEFAULT]
# a stopped container's hostname does not resolve; keep the others starting
AllowUnresolvedHostnames=true

[NDB_MGMD]
NodeId=65
HostName=mgmd
PortNumber=1186
DataDir=/srv/hops/mysql-cluster/log
ArbitrationRank=1

[NDBD]
NodeId=1
NodeGroup=0
HostName=ndbd-1
ServerPort=11860

[NDBD]
NodeId=2
NodeGroup=0
HostName=ndbd-2
ServerPort=11860

# MySQL Server (ndb-cluster-connection-pool=1 in my.cnf -> one slot)
[MYSQLD]
NodeId=67
HostName=mysqld

# REST API server (rdrs2)
[API]
NodeId=195
HostName=rest

# free slots for NDB API tools (ndb_desc, ndb_select_all, ...) run from any container
[API]
NodeId=231
[API]
NodeId=232
