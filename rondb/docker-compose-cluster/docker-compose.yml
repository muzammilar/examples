name: rondb-cluster

# The minimal RonDB cluster from github.com/logicalclocks/rondb-docker (1 management
# server, 1 node group of 2 data nodes = NoOfReplicas 2, 1 MySQL Server, 1 REST API
# server), written out by hand instead of generated by its build_run_docker.sh.
# Every process gets its cluster config from ndb_mgmd (config/config.ini) via
# --ndb-connectstring=mgmd:1186. Memory sizes follow rondb-docker's "mini" profile.
x-rondb: &rondb
  image: hopsworks/rondb:${RONDB_VERSION:-26.02.10}
  # any non-root uid works (the image's directories are world-writable); rondb-docker
  # runs as the host user, mysqld refuses to run as root without --user=root
  user: "1000:1000"
  # The image's entrypoint (docker/rondb_standalone/entrypoints/main.sh) adds
  # --nodaemon to ndb_mgmd/ndbmtd and -f config.ini to ndb_mgmd, and initializes
  # mysqld's data directory before starting it.

services:
  mgmd:
    <<: *rondb
    container_name: rondb-mgmd
    hostname: mgmd
    command: ["ndb_mgmd", "--ndb-nodeid=65", "--initial"]
    mem_limit: 256m
    volumes:
      - ./config/config.ini:/srv/hops/mysql-cluster/config.ini:ro
    healthcheck:
      test: ["CMD", "ndb_mgm", "--ndb-connectstring=mgmd:1186", "-e", "show"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --initial wipes a data node's file system; only pass it on the very first start so a
  # restarted node recovers from its own checkpoint + redo log and catches up from its peer.
  ndbd-1: &ndbd
    <<: *rondb
    container_name: rondb-ndbd-1
    hostname: ndbd-1
    environment: { NODE_ID: 1 }
    command:
      - bash
      - -c
      - >-
        exec ndbmtd --nodaemon --ndb-nodeid=$$NODE_ID --ndb-connectstring=mgmd:1186
        $$([ -d /srv/hops/mysql-cluster/ndb_data/ndb_$${NODE_ID}_fs ] || echo --initial)
    cap_add: [SYS_NICE] # NUMA memory binding (mbind)
    mem_limit: 2500m
    volumes:
      - ndbd-1:/srv/hops/mysql-cluster/ndb_data
    depends_on:
      mgmd: { condition: service_healthy }
    healthcheck:
      # rondb-docker's check: `ndb_mgm -e "<id> status"` reports "started"
      test: ["CMD-SHELL", "./docker/rondb_standalone/healthcheck.sh mgmd:1186 $$NODE_ID"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
  ndbd-2:
    <<: *ndbd
    container_name: rondb-ndbd-2
    hostname: ndbd-2
    environment: { NODE_ID: 2 }
    volumes:
      - ndbd-2:/srv/hops/mysql-cluster/ndb_data

  mysqld:
    <<: *rondb
    container_name: rondb-mysqld
    hostname: mysqld
    command: ["mysqld"]
    cap_add: [SYS_NICE]
    mem_limit: 1400m
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true" # root@localhost, no password
      MYSQL_INITIALIZE_DB: "1"           # runs config/init.sql (user rondb/rondb @ '%')
    ports:
      - "${RONDB_MYSQL_PORT:-3307}:3306"
    volumes:
      - ./config/my.cnf:/srv/hops/mysql-cluster/my.cnf:ro
      - ./config/init.sql:/srv/hops/docker/rondb_standalone/sql_init_scripts/init.sql:ro
      - ./sql:/sql:ro
    depends_on:
      ndbd-1: { condition: service_healthy }
      ndbd-2: { condition: service_healthy }
    healthcheck:
      # healthy once mysqld listens on TCP (not the entrypoint's temporary --skip-networking
      # init server) and is connected to at least one started data node
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -urondb -prondb -Nse \"SHOW STATUS LIKE 'Ndb_number_of_ready_data_nodes'\" 2>/dev/null | awk '$$2 > 0 {ok=1} END {exit !ok}'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # REST API server: pk-read / batch / scan over HTTP straight to the data nodes (NDB API)
  rest:
    <<: *rondb
    container_name: rondb-rest
    hostname: rest
    # via bash: main.sh appends --nodaemon to anything but `rdrs` (the older Go server)
    command: ["bash", "-c", "exec rdrs2 --config /srv/hops/mysql-cluster/rest_api.json"]
    mem_limit: 512m
    ports:
      - "${RONDB_REST_PORT:-4406}:4406"
    volumes:
      - ./config/rest_api.json:/srv/hops/mysql-cluster/rest_api.json:ro
    depends_on:
      mysqld: { condition: service_healthy }
    healthcheck:
      # no curl in the image: GET /0.1.0/health over bash's /dev/tcp, expect HTTP 200
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4406 && printf 'GET /0.1.0/health HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  ndbd-1:
  ndbd-2:
