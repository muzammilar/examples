# RonDB cluster configuration for the online scaling walkthrough (make help).
#
# Start: node group 0 = data nodes 1 + 2 (NoOfReplicas=2), one MySQL Server.
# Data nodes 3 + 4 are already in the configuration but inactive (NodeActive=0) and in no
# node group (NodeGroup=65536): `ndb_mgm -e "3 activate"` lets them connect without a
# configuration change or rolling restart, and `CREATE NODEGROUP 3,4` turns them into
# node group 1. Spare [MYSQLD]/[API] slots let more MySQL Servers and REST API servers
# join at any time.

[NDBD DEFAULT]
NoOfReplicas=2
DataDir=/srv/hops/mysql-cluster/log
FileSystemPath=/srv/hops/mysql-cluster/ndb_data
BackupDataDir=/srv/hops/mysql-cluster/ndb/backups
# 2 CPUs worth of threads per data node (compose caps each container at 2 CPUs)
AutomaticThreadConfig=true
NumCPUs=2
# Memory pools set by hand (AutomaticMemoryConfig needs TotalMemoryConfig >= 2G per node);
# `make scale-up` raises DataMemory with config/config-scale-up.ini and a rolling restart.
AutomaticMemoryConfig=false
DataMemory=768M
DiskPageBufferMemory=32M
SchemaMemory=50M
ReplicationMemory=20M
LongMessageBuffer=16M
TransactionMemory=150M
SharedGlobalMemory=150M
MaxNoOfTables=128
MaxNoOfAttributes=4000
MaxNoOfOrderedIndexes=128
MaxNoOfUniqueHashIndexes=64
MaxNoOfTriggers=1000
ReservedConcurrentOperations=20000
MaxNoOfConcurrentOperations=100000
# redo log: log parts x 8 files x 64M (4 x 16M overloads during the bulk load: error 410)
NoOfFragmentLogFiles=8
FragmentLogFileSize=64M
RedoBuffer=16M
# shared, oversubscribed CPUs: sleep instead of spinning
SpinMethod=StaticSpinning

[TCP DEFAULT]
# stopped / not yet created containers' hostnames do not resolve
AllowUnresolvedHostnames=true

[NDB_MGMD]
NodeId=65
HostName=mgmd
PortNumber=1186
DataDir=/srv/hops/mysql-cluster/log
ArbitrationRank=1

[NDBD]
NodeId=1
NodeGroup=0
HostName=ndbd-1
ServerPort=11860

[NDBD]
NodeId=2
NodeGroup=0
HostName=ndbd-2
ServerPort=11860

# the second node group, prepared but inactive: no data, not part of the cluster yet
[NDBD]
NodeId=3
NodeGroup=65536
NodeActive=0
HostName=ndbd-3
ServerPort=11860

[NDBD]
NodeId=4
NodeGroup=65536
NodeActive=0
HostName=ndbd-4
ServerPort=11860

# MySQL Servers: mysqld-1 at start, mysqld-2 joins with `make add-api`
[MYSQLD]
NodeId=67
HostName=mysqld-1
[MYSQLD]
NodeId=68
HostName=mysqld-2

# REST API server (rdrs2), joins with `make add-api`
[API]
NodeId=195
HostName=rest

# free slots for NDB API tools (ndb_desc, ndb_select_all, ...) run from any container
[API]
NodeId=231
[API]
NodeId=232
