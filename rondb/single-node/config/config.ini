# Smallest RonDB layout: one management server, ONE data node (NoOfReplicas=1, so one
# node group holding the only copy of every fragment) and one MySQL Server. Values are
# rondb-docker's "mini" profile shrunk further: no redundancy, ~1 GB for the data node.

[NDBD DEFAULT]
# one replica: if the data node stops, the cluster stops (nothing to fail over to)
NoOfReplicas=1
DataDir=/srv/hops/mysql-cluster/log
FileSystemPath=/srv/hops/mysql-cluster/ndb_data
BackupDataDir=/srv/hops/mysql-cluster/ndb/backups
# Threads: AutomaticThreadConfig with NumCPUs=1 -> one block thread doing receive, LDM,
# TC, main and rep work (ndbinfo.threads: recv_ldm_tc_main_rep).
AutomaticThreadConfig=true
NumCPUs=1
# Memory: AutomaticMemoryConfig takes TotalMemoryConfig >= 2G ("Legal values are between
# 2147483648 and ..."), which sizes DataMemory at ~1.15 GB and the process at ~1.9 GB.
# Setting the pools by hand instead gives ~760 MB of global memory, ~1 GB per process.
AutomaticMemoryConfig=false
DataMemory=256M
DiskPageBufferMemory=32M
SchemaMemory=50M
ReplicationMemory=20M
LongMessageBuffer=16M
MaxNoOfTables=128
MaxNoOfAttributes=4000
MaxNoOfOrderedIndexes=128
MaxNoOfUniqueHashIndexes=64
MaxNoOfTriggers=1000
TransactionMemory=100M
SharedGlobalMemory=100M
ReservedConcurrentOperations=20000
MaxNoOfConcurrentOperations=100000
# small redo log (log parts x 4 files x 16M) instead of the 64 GB production default
NoOfFragmentLogFiles=4
FragmentLogFileSize=16M
RedoBuffer=16M
# shared, oversubscribed CPUs: sleep instead of spinning
SpinMethod=StaticSpinning

[TCP DEFAULT]
# ndb_mgmd starts before the data node's container exists, so its hostname does not
# resolve yet ("Could not resolve hostname [node 1]: ndbd" otherwise)
AllowUnresolvedHostnames=true

[NDB_MGMD]
NodeId=65
HostName=mgmd
PortNumber=1186
DataDir=/srv/hops/mysql-cluster/log

[NDBD]
NodeId=1
NodeGroup=0
HostName=ndbd
ServerPort=11860

# MySQL Server (ndb-cluster-connection-pool=1 in my.cnf -> one slot)
[MYSQLD]
NodeId=67
HostName=mysqld

# free slots for NDB API tools (ndb_desc, ndb_select_all, ...) run from any container
[API]
NodeId=231
[API]
NodeId=232
