name: rondb-single

# The smallest RonDB footprint: RonDB always runs as separate processes, so "single node"
# here means one of each: 1 management server, 1 data node (NoOfReplicas=1) and 1 MySQL
# Server, ~2 GB in total. No redundancy: stop the data node and the cluster is down.
x-rondb: &rondb
  image: hopsworks/rondb:${RONDB_VERSION:-26.02.11}
  # mysqld refuses to run as root; the image's directories are world-writable
  user: "1000:1000"
  # The image's entrypoint (docker/rondb_standalone/entrypoints/main.sh) adds
  # --nodaemon to ndb_mgmd/ndbmtd and -f config.ini to ndb_mgmd, and initializes
  # mysqld's data directory before starting it.

services:
  mgmd:
    <<: *rondb
    container_name: rondb-single-mgmd
    hostname: mgmd
    command: ["ndb_mgmd", "--ndb-nodeid=65", "--initial"]
    mem_limit: 256m
    volumes:
      - ./config/config.ini:/srv/hops/mysql-cluster/config.ini:ro
    healthcheck:
      test: ["CMD", "ndb_mgm", "--ndb-connectstring=mgmd:1186", "-e", "show"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --initial wipes the data node's file system: only on the very first start, so a
  # restart recovers the data from its own checkpoint + redo log
  ndbd:
    <<: *rondb
    container_name: rondb-single-ndbd
    hostname: ndbd
    command:
      - bash
      - -c
      - >-
        exec ndbmtd --nodaemon --ndb-nodeid=1 --ndb-connectstring=mgmd:1186
        $$([ -d /srv/hops/mysql-cluster/ndb_data/ndb_1_fs ] || echo --initial)
    cap_add: [SYS_NICE] # NUMA memory binding (mbind)
    mem_limit: 1400m
    volumes:
      - ndbd:/srv/hops/mysql-cluster/ndb_data
    depends_on:
      mgmd: { condition: service_healthy }
    healthcheck:
      # rondb-docker's check: `ndb_mgm -e "1 status"` reports "started"
      test: ["CMD-SHELL", "./docker/rondb_standalone/healthcheck.sh mgmd:1186 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  mysqld:
    <<: *rondb
    container_name: rondb-single-mysqld
    hostname: mysqld
    command: ["mysqld"]
    cap_add: [SYS_NICE]
    mem_limit: 1g
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true" # root@localhost, no password
      MYSQL_INITIALIZE_DB: "1"           # runs config/init.sql (user rondb/rondb @ '%')
    ports:
      - "127.0.0.1:${RONDB_MYSQL_PORT:-3306}:3306"
    volumes:
      - ./config/my.cnf:/srv/hops/mysql-cluster/my.cnf:ro
      - ./config/init.sql:/srv/hops/docker/rondb_standalone/sql_init_scripts/init.sql:ro
    depends_on:
      ndbd: { condition: service_healthy }
    healthcheck:
      # healthy once mysqld listens on TCP (not the entrypoint's temporary --skip-networking
      # init server) and sees the started data node
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -urondb -prondb -Nse \"SHOW STATUS LIKE 'Ndb_number_of_ready_data_nodes'\" 2>/dev/null | awk '$$2 > 0 {ok=1} END {exit !ok}'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # `make benchmark`: sysbench OLTP via the MySQL Server (bench/run.sh, image built from
  # bench/Dockerfile), raw output to results/
  bench:
    build: ./bench
    profiles: [bench]
    cpus: ${BENCH_CLIENT_CPUS:-2}
    command: ["sh", "/bench/run.sh"]
    environment:
      NAME: ${NAME:-}
      DURATION: ${DURATION:-30}
      THREADS: ${THREADS:-8}
      TABLES: ${TABLES:-2}
      TABLE_SIZE: ${TABLE_SIZE:-50000}
    volumes:
      - ./bench:/bench:ro
      - ./results:/results

  # `make benchmark`: parses the raw output (bench/report.py) into a table and results/*.json
  bench-report:
    image: ghcr.io/astral-sh/uv:0.12.19-python3.13-trixie-slim
    profiles: [bench]
    network_mode: none
    working_dir: /bench
    command: ["uv", "run", "--frozen", "report.py"]
    environment:
      UV_CACHE_DIR: /uv/cache
      UV_PROJECT_ENVIRONMENT: /uv/venv
      UV_PYTHON_DOWNLOADS: never
      NAME: ${NAME:-}
      HOST_INFO: ${HOST_INFO:-}
      DOCKER_INFO: ${DOCKER_INFO:-}
    volumes:
      - ./bench:/bench:ro
      - ./results:/results
      - uv-cache:/uv

volumes:
  ndbd:
  uv-cache:
