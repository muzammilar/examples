global
  maxconn 256
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s
  hold nx 2s
  hold timeout 2s
  hold refused 2s
  hold other 2s
defaults
  mode http
  timeout connect 3s
  timeout client 60s
  timeout server 60s
frontend s3
  bind :9000
  default_backend gateways
frontend health
  bind :8404
  http-request return status 200 content-type text/plain string ready
backend gateways
  balance roundrobin
  server api0 s3api0:8333 check resolvers docker resolve-prefer ipv4 init-addr libc,none inter 1s fall 2 rise 2
  server api1 s3api1:8333 check resolvers docker resolve-prefer ipv4 init-addr libc,none inter 1s fall 2 rise 2
  server api2 s3api2:8333 check resolvers docker resolve-prefer ipv4 init-addr libc,none inter 1s fall 2 rise 2
