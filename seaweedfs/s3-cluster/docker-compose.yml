  s3:
    image: haproxy:3.2.8-alpine
    cpus: 0.5
    mem_limit: 128m
    volumes:
    - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8404/health
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      s3api0:
        condition: service_healthy
      s3api1:
        condition: service_healthy
      s3api2:
        condition: service_healthy
  tools:
    image: ${COMPOSE_PROJECT_NAME:-seaweedfs-s3-cluster}-tools:dev
    build:
      context: ./.build/tools
      dockerfile: Dockerfile
    profiles:
    - tools
    cpus: 2
    mem_limit: 2g
    environment:
      S3_ENDPOINT: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-GK0123456789abcdef01234567}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-only-object-storage-secret-key}
      OBJECTS: ${OBJECTS:-10000}
      LARGE_OBJECTS: ${LARGE_OBJECTS:-128}
      DURATION: ${DURATION:-600}
      BENCH_SMALL_REQUESTS: ${BENCH_SMALL_REQUESTS:-10000}
      BENCH_REQUESTS: ${BENCH_REQUESTS:-256}
      BENCH_LARGE_REQUESTS: ${BENCH_LARGE_REQUESTS:-128}
    volumes:
