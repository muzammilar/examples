    image: ${ETCD_IMAGE:-gcr.io/etcd-development/etcd:v3.7.4@sha256:47d217be8ec4ca943954b5f4bf8029ee9bc0ffb05fbe2a44d579a1f640e03ed4}
    hostname: etcd0
    entrypoint:
    - /usr/local/bin/etcd
    command:
    - --name=etcd0
    - --data-dir=/data
    - --listen-client-urls=http://0.0.0.0:2379
    - --advertise-client-urls=http://etcd0:2379
    - --listen-peer-urls=http://0.0.0.0:2380
    - --initial-advertise-peer-urls=http://etcd0:2380
    - --initial-cluster=etcd0=http://etcd0:2380,etcd1=http://etcd1:2380,etcd2=http://etcd2:2380
    - --initial-cluster-token=seaweed-s3-example
    - --auto-compaction-retention=1
    volumes:
    - etcd0:/data
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/etcdctl
      - endpoint
      - health
      interval: 5s
      timeout: 5s
      retries: 60
  etcd1:
    image: ${ETCD_IMAGE:-gcr.io/etcd-development/etcd:v3.7.4@sha256:47d217be8ec4ca943954b5f4bf8029ee9bc0ffb05fbe2a44d579a1f640e03ed4}
