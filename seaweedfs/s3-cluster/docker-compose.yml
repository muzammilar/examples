    hostname: volume0
    command:
    - volume
    - -ip=volume0
    - -ip.bind=0.0.0.0
    - -port=8080
    - -dir=/data
    - -master=master0:9333,master1:9333,master2:9333
    - -max=128
    - -dataCenter=zone0
    - -rack=rack0
    - -minFreeSpace=1GiB
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8080/healthz
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
    - volume0:/data
    depends_on:
      master0:
        condition: service_healthy
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
