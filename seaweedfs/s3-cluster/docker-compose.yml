name: ${COMPOSE_PROJECT_NAME:-seaweedfs-s3-cluster}
services:
  master0:
    image: ${SEAWEED_IMAGE:-chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9}
    hostname: master0
    command:
    - master
    - -ip=master0
    - -ip.bind=0.0.0.0
    - -mdir=/data
    - -peers=master0:9333,master1:9333,master2:9333
    - -defaultReplication=200
    - -volumeSizeLimitMB=64
    cpus: 0.5
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9333/cluster/status
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
    - master0:/data
  master1:
    image: ${SEAWEED_IMAGE:-chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9}
    hostname: master1
