name: kafka-connect-postgres-enrichment

x-controller-env: &controller-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: controller
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data

x-broker-env: &broker-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:9093,2@kafka-controller-2:9093,3@kafka-controller-3:9093
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

x-kafka-base: &kafka-base
  image: apache/kafka:4.3.2
  networks: [kafka-connect]
  restart: unless-stopped

services:
  kafka-controller-1:
    <<: *kafka-base
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1
    volumes: [kafka-controller-1-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-metadata-quorum.sh, --bootstrap-controller, localhost:9093, describe, --status]
      interval: 15s
      timeout: 10s
      retries: 12

  kafka-controller-2:
    <<: *kafka-base
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 2
    volumes: [kafka-controller-2-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-metadata-quorum.sh, --bootstrap-controller, localhost:9093, describe, --status]
      interval: 15s
      timeout: 10s
      retries: 12

  kafka-controller-3:
    <<: *kafka-base
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 3
    volumes: [kafka-controller-3-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-metadata-quorum.sh, --bootstrap-controller, localhost:9093, describe, --status]
      interval: 15s
      timeout: 10s
      retries: 12

  kafka-broker-1:
    <<: *kafka-base
    depends_on:
      kafka-controller-1: {condition: service_healthy}
      kafka-controller-2: {condition: service_healthy}
      kafka-controller-3: {condition: service_healthy}
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 4
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:19092,PLAINTEXT_HOST://localhost:${KAFKA_BROKER_1_PORT:-29092}
    ports: ["127.0.0.1:${KAFKA_BROKER_1_PORT:-29092}:9092"]
    volumes: [kafka-broker-1-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:19092]
      interval: 15s
      timeout: 10s
      retries: 12

  kafka-broker-2:
    <<: *kafka-base
    depends_on:
      kafka-controller-1: {condition: service_healthy}
      kafka-controller-2: {condition: service_healthy}
      kafka-controller-3: {condition: service_healthy}
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 5
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:19092,PLAINTEXT_HOST://localhost:${KAFKA_BROKER_2_PORT:-39092}
    ports: ["127.0.0.1:${KAFKA_BROKER_2_PORT:-39092}:9092"]
    volumes: [kafka-broker-2-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:19092]
      interval: 15s
      timeout: 10s
      retries: 12

  kafka-broker-3:
    <<: *kafka-base
    depends_on:
      kafka-controller-1: {condition: service_healthy}
      kafka-controller-2: {condition: service_healthy}
      kafka-controller-3: {condition: service_healthy}
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 6
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:19092,PLAINTEXT_HOST://localhost:${KAFKA_BROKER_3_PORT:-49092}
    ports: ["127.0.0.1:${KAFKA_BROKER_3_PORT:-49092}:9092"]
    volumes: [kafka-broker-3-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-broker-api-versions.sh, --bootstrap-server, localhost:19092]
      interval: 15s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:18.7
    networks: [kafka-connect]
    restart: unless-stopped
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10]
    environment:
      POSTGRES_DB: enrichment
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: demo-admin-password
      CUSTOMER_COUNT: ${CUSTOMER_COUNT:-10000}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/01-seed.sh:ro
      - ./postgres/init.sql:/tmp/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U admin -d enrichment]
      interval: 5s
      timeout: 5s
      retries: 12

  connect-1:
    image: quay.io/debezium/connect:3.7.1.Final
    networks: [kafka-connect]
    restart: unless-stopped
    depends_on:
      kafka-broker-1: {condition: service_healthy}
      kafka-broker-2: {condition: service_healthy}
      kafka-broker-3: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment: &connect-env
      BOOTSTRAP_SERVERS: kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092
      GROUP_ID: kafka-connect-postgres
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: connect-1
      REST_PORT: 8083
      OFFSET_FLUSH_INTERVAL_MS: 1000
    ports: ["127.0.0.1:${CONNECT_PORT:-8083}:8083"]
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost:8083/connectors >/dev/null]
      interval: 10s
      timeout: 5s
      retries: 18

  connect-2:
    image: quay.io/debezium/connect:3.7.1.Final
    networks: [kafka-connect]
    restart: unless-stopped
    depends_on:
      kafka-broker-1: {condition: service_healthy}
      kafka-broker-2: {condition: service_healthy}
      kafka-broker-3: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      <<: *connect-env
      REST_ADVERTISED_HOST_NAME: connect-2
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost:8083/connectors >/dev/null]
      interval: 10s
      timeout: 5s
      retries: 18

  processor:
    build:
      context: .
      dockerfile: processor/Dockerfile
    networks: [kafka-connect]
    restart: unless-stopped
    depends_on:
      kafka-broker-1: {condition: service_healthy}
      kafka-broker-2: {condition: service_healthy}
      kafka-broker-3: {condition: service_healthy}
      connect-1: {condition: service_healthy}
      connect-2: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092
      INPUT_TOPIC: orders
      OUTPUT_TOPIC: orders.enriched
      CUSTOMER_TOPIC: pg.public.customers
      EXPECTED_CUSTOMERS: ${CUSTOMER_COUNT:-10000}
      CONSUMER_GROUP: orders-enricher
    ports: ["127.0.0.1:${PROCESSOR_PORT:-8080}:8080"]
    healthcheck:
      test: [CMD, /enricher, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 60

  producer:
    profiles: [apps]
    build:
      context: .
      dockerfile: producer/Dockerfile
    networks: [kafka-connect]
    environment:
      BOOTSTRAP_SERVERS: kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092
      TOPIC: orders
      COUNT: 2000000
      CUSTOMER_COUNT: ${CUSTOMER_COUNT:-10000}
      RUN_ID: connect-demo
    depends_on:
      kafka-broker-1: {condition: service_healthy}
      kafka-broker-2: {condition: service_healthy}
      kafka-broker-3: {condition: service_healthy}

  consumer:
    profiles: [apps]
    build:
      context: .
      dockerfile: consumer/Dockerfile
    networks: [kafka-connect]
    environment:
      BOOTSTRAP_SERVERS: kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092
      TOPIC: orders.enriched
      GROUP_ID: kafka-connect-demo-consumer
      EXPECTED_COUNT: 2000000
      TIMEOUT_SECONDS: 1800
      RUN_ID: connect-demo
    depends_on:
      kafka-broker-1: {condition: service_healthy}
      kafka-broker-2: {condition: service_healthy}
      kafka-broker-3: {condition: service_healthy}

networks:
  kafka-connect:
    driver: bridge

volumes:
  kafka-controller-1-data:
  kafka-controller-2-data:
  kafka-controller-3-data:
  kafka-broker-1-data:
  kafka-broker-2-data:
  kafka-broker-3-data:
  postgres-data:
