syntax = "proto3";

package kafka.demo.v1;

option optimize_for = SPEED;
option go_package = "example.com/kafka-enricher/kafka/demo/v1;demov1";

message Order {
  string order_id = 1;
  string customer_id = 2;
  int64 amount_cents = 3;
  int64 created_at_unix_ms = 4;
}

message Customer {
  string customer_id = 1;
  string display_name = 2;
  string segment = 3;
}

message EnrichedOrder {
  Order order = 1;
  Customer customer = 2;
}
