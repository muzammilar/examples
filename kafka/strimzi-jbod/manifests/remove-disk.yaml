apiVersion: kafka.strimzi.io/v1
kind: KafkaRebalance
metadata:
  name: kafka-jbod-rebalance
  labels:
    strimzi.io/cluster: kafka
spec:
  mode: remove-disks
  moveReplicasOffVolumes:
    - brokerId: 3
      volumeIds: [1]
    - brokerId: 4
      volumeIds: [1]
    - brokerId: 5
      volumeIds: [1]
