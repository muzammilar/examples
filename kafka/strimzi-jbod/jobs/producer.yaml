apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-producer
  labels:
    app: kafka-producer
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: kafka-producer
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producer
          image: kafka-strimzi-producer:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: BOOTSTRAP_SERVERS
              value: kafka-kafka-bootstrap.kafka.svc:9092
            - name: TOPIC
              value: orders
            - name: COUNT
              value: "${COUNT}"
            - name: RUN_ID
              value: "${RUN_ID}"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
