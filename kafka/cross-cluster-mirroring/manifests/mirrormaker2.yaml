apiVersion: kafka.strimzi.io/v1
kind: KafkaMirrorMaker2
metadata:
  name: replication
spec:
  version: 4.3.2
  replicas: 2
  target:
    alias: west
    bootstrapServers: west-kafka-bootstrap:9092
    groupId: mm2-west
    configStorageTopic: mm2-west-configs
    offsetStorageTopic: mm2-west-offsets
    statusStorageTopic: mm2-west-status
    config:
      exactly.once.source.support: enabled
      config.storage.replication.factor: 3
      offset.storage.replication.factor: 3
      status.storage.replication.factor: 3
  mirrors:
    - source:
        alias: east
        bootstrapServers: east-kafka-bootstrap:9092
      sourceConnector:
        tasksMax: 3
        config:
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
          exactly.once.support: required
          consumer.isolation.level: read_committed
          replication.factor: 3
          offset-syncs.topic.replication.factor: 3
          refresh.topics.interval.seconds: 5
          sync.topic.configs.enabled: true
          sync.topic.acls.enabled: false
      checkpointConnector:
        tasksMax: 1
        config:
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
          checkpoints.topic.replication.factor: 3
          emit.checkpoints.enabled: true
          emit.checkpoints.interval.seconds: 5
          refresh.groups.interval.seconds: 5
          sync.group.offsets.enabled: true
          sync.group.offsets.interval.seconds: 5
      topicsPattern: "^orders-[0-9]+$"
      groupsPattern: "^dr-.*"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
