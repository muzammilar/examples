[package]
name = "session-store-showcase"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# the official Skytable driver (async connections need tokio, which it already depends on)
skytable = "0.8.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
libc = "0.2" # setsockopt(TCP_NODELAY), see set_nodelay_on_all_sockets

[profile.release]
codegen-units = 1
