global
  log stdout format raw local0
defaults
  mode tcp
  timeout connect 3s
  timeout client 2m
  timeout server 2m
frontend sql
  bind *:3306
  default_backend mysql
backend mysql
  balance roundrobin
  server sql0 sql0:3306 check inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
  server sql1 sql1:3306 check inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
frontend health
  mode http
  bind *:8404
  http-request return status 200 if { nbsrv(mysql) gt 0 }
  http-request return status 503
