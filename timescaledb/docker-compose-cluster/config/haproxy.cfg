# One endpoint for writes (5000: whichever node Patroni's REST API says is the primary) and one
# for reads (5001: round-robin over the healthy replicas). Patroni answers GET /primary and
# GET /replica with 200 only on the matching role.
global
	maxconn 500

resolvers docker
	nameserver dns 127.0.0.11:53
	hold valid 1s

defaults
	mode tcp
	timeout connect 3s
	timeout client 30m
	timeout server 30m
	timeout check 2s
	# a stopped container's name stops resolving: keep the server, mark it down
	default-server init-addr last,libc,none resolvers docker inter 1s fall 2 rise 2 on-marked-down shutdown-sessions

listen stats
	mode http
	bind *:7000
	stats enable
	stats uri /

listen primary
	bind *:5000
	option httpchk GET /primary
	http-check expect status 200
	server tsdb1 tsdb1:5432 check port 8008
	server tsdb2 tsdb2:5432 check port 8008
	server tsdb3 tsdb3:5432 check port 8008

listen replicas
	bind *:5001
	balance roundrobin
	option httpchk GET /replica
	http-check expect status 200
	server tsdb1 tsdb1:5432 check port 8008
	server tsdb2 tsdb2:5432 check port 8008
	server tsdb3 tsdb3:5432 check port 8008
