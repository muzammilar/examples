[package]
name = "kv-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A replicated key-value store: Raft consensus over a write-ahead log"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1.4"
# Lets the demo rebuild a wiped node; unsafe in general, see README.
openraft = { version = "0.9.25", features = ["loosen-follower-log-revert", "serde", "storage-v2"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
tempfile = "3"

[[bench]]
name = "writes"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
