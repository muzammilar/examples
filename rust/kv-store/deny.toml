# Policy for `cargo deny check`, run by `make quality`: known vulnerabilities,
# licenses, duplicate crates, and where crates may come from.

[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]

[licenses.private]
# This crate isn't published; its own license is irrelevant.
ignore = true

[bans]
# openraft pulls in older versions of a few crates we also use. That's not
# ours to fix: report it, don't fail on it.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
