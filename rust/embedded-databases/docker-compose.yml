name: rust-embedded-catalog
services:
  evaluation:
    image: rust-embedded-catalog:dev
    build:
      context: .
      dockerfile: catalog-workload/Dockerfile
    init: true
    user: ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
    network_mode: none
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      SEED_PAIRS: ${SEED_PAIRS:-100000}
    volumes:
      - catalog:/database
      - ./results:/results
volumes:
  catalog:
