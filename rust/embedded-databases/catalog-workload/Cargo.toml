[package]
name = "embedded-catalog-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
anyhow = "=1.0.100"
fjall = "=3.1.13"
redb = "=5.0.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4"] }

[profile.release]
debug = false
strip = true
