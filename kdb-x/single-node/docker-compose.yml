name: kdbx-single

# One KDB-X q process listening on port 5000 (host: KDBX_PORT, default 5101), data under the
# kdbx-data volume (/data). The image (../image) downloads the public q binary; the license comes
# from KDB_LICENSE_B64 / KDB_LICENSE_K4B64 or ../license/{kc,k4}.lic, see ../README.md.
x-kdbx: &kdbx
  build:
    context: ../image
    args:
      KDB_X_VERSION: ${KDB_X_VERSION:-5.0.20261002}
  environment:
    KDB_LICENSE_B64: ${KDB_LICENSE_B64:-}
    KDB_LICENSE_K4B64: ${KDB_LICENSE_K4B64:-}
  volumes:
    - ../license:/license:ro
    - ./q:/q:ro

services:
  kdbx:
    <<: *kdbx
    container_name: kdbx-single
    # -s 4: secondary threads for peach / parallel queries (4 is the Community Edition maximum)
    command: ["q", "-p", "5000", "-s", "4"]
    ports:
      - "${KDBX_PORT:-5101}:5000"
    volumes:
      - ../license:/license:ro
      - ./q:/q:ro
      - kdbx-data:/data
    # q has no health endpoint; a TCP connect means the listener is up (it opens after the license check)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 2s
      timeout: 2s
      retries: 30

  # `make benchmark`: a second q process (same image) that drives bench/bench.q over IPC
  bench:
    <<: *kdbx
    profiles: [bench]
    cpus: ${BENCH_CLIENT_CPUS:-2}
    command: ["q", "/bench/bench.q", "-q"]
    environment:
      KDB_LICENSE_B64: ${KDB_LICENSE_B64:-}
      KDB_LICENSE_K4B64: ${KDB_LICENSE_K4B64:-}
      KDBX_HOST: kdbx
      BENCH_LIMITS: ${BENCH_LIMITS:-} # bench/limits.sh, copied into the JSON
      DOCKER_INFO: ${DOCKER_INFO:-}
      N: ${N:-}
      SMOKE: ${SMOKE:-}
    volumes:
      - ../license:/license:ro
      - ./bench:/bench:ro
      - ./results:/results
    depends_on:
      kdbx: { condition: service_healthy }

volumes:
  kdbx-data:
