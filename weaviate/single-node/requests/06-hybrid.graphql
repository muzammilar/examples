# alpha 0 = pure BM25, 1 = pure vector; 0.5 blends both rankings
{
  Get {
    Landmark(
      hybrid: { query: "palace", vector: [0.2, 0.1, 0.9, 0.7], alpha: 0.5 }
      where: { path: ["year"], operator: GreaterThan, valueInt: 1400 }
      limit: 3
    ) {
      name year _additional { score }
    }
  }
}
