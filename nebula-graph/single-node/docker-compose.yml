name: nebula-graph-single

# Smallest working NebulaGraph: one metad, one storaged, one graphd.
# storaged only becomes healthy after `make up` registers it with ADD HOSTS.
services:
  metad:
    image: vesoft/nebula-metad:${NEBULA_VERSION:-v3.8.0}
    container_name: nebula-metad
    hostname: metad
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=metad
      - --ws_ip=metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --heartbeat_interval_secs=2 # default 10; new spaces/schema propagate within ~2 beats
    volumes:
      - meta-data:/data/meta
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://metad:19559/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  storaged:
    image: vesoft/nebula-storaged:${NEBULA_VERSION:-v3.8.0}
    container_name: nebula-storaged
    hostname: storaged
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=storaged
      - --ws_ip=storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --heartbeat_interval_secs=2 # default 10; new spaces/schema propagate within ~2 beats
    depends_on:
      metad: { condition: service_healthy }
    volumes:
      - storage-data:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://storaged:19779/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  graphd:
    image: vesoft/nebula-graphd:${NEBULA_VERSION:-v3.8.0}
    container_name: nebula-graphd
    hostname: graphd
    command:
      - --meta_server_addrs=metad:9559
      - --local_ip=graphd
      - --ws_ip=graphd
      - --port=9669
      - --ws_http_port=19669
      - --heartbeat_interval_secs=2 # default 10; new spaces/schema propagate within ~2 beats
    depends_on:
      metad: { condition: service_healthy }
    ports:
      - "9669:9669" # graph service (clients)
    healthcheck:
      # the HTTP status answers before graphd has synced with metad and opened 9669
      test: ["CMD", "bash", "-c", "</dev/tcp/graphd/9669"]
      interval: 5s
      timeout: 3s
      retries: 30

  # `make test` / `make cli` run nebula-console from here
  console:
    image: vesoft/nebula-console:${NEBULA_VERSION:-v3.8.0}
    profiles: [tools]
    entrypoint: ["nebula-console", "-addr", "graphd", "-port", "9669", "-u", "root", "-p", "nebula"]

  # uv + Python 3.13, used by `make benchmark` (bench/bench.py, deps pinned in bench/uv.lock)
  bench:
    image: ghcr.io/astral-sh/uv:0.12.19-python3.13-trixie-slim
    profiles: [bench]
    working_dir: /bench
    command: ["uv", "run", "--frozen", "bench.py"]
    environment:
      UV_CACHE_DIR: /uv/cache              # wheel cache and venv live in the uv volume,
      UV_PROJECT_ENVIRONMENT: /uv/venv     # so reruns skip downloads and installs
      UV_PYTHON_DOWNLOADS: never           # use the image's Python
      PYTHONDONTWRITEBYTECODE: "1"
      SMOKE: ${SMOKE:-}
      N: ${N:-}
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    volumes:
      - ./bench:/bench:ro
      - ./results:/results
      - uv-cache:/uv

volumes:
  meta-data:
  storage-data:
  uv-cache:
