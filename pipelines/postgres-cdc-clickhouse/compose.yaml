name: postgres-cdc-clickhouse
services:
  controller1:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: &id001
    - lab
    stop_grace_period: 30s
    mem_limit: 384m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
      KAFKA_NODE_ID: 1
    volumes:
    - controller1:/var/lib/kafka/data
  controller2:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 384m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
      KAFKA_NODE_ID: 2
    volumes:
    - controller2:/var/lib/kafka/data
  controller3:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 384m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
      KAFKA_NODE_ID: 3
    volumes:
    - controller3:/var/lib/kafka/data
  broker1:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 512m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_NODE_ID: 4
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092
    volumes:
    - broker1:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        >/dev/null
      interval: 15s
      timeout: 20s
      retries: 30
  broker2:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 512m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_NODE_ID: 5
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092
    volumes:
    - broker2:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        >/dev/null
      interval: 15s
      timeout: 20s
      retries: 30
  broker3:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 512m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_NODE_ID: 6
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker3:9092
    volumes:
    - broker3:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        >/dev/null
      interval: 15s
      timeout: 20s
      retries: 30
  postgres:
    image: postgres:18.7@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    cpus: 0.5
    mem_limit: 512m
    networks:
    - lab
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local-pipeline-only
    command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_replication_slots=4
    - -c
    - max_wal_senders=4
    - -c
    - max_slot_wal_keep_size=1GB
    volumes:
    - postgres:/var/lib/postgresql
    - ./sql/source.sql:/docker-entrypoint-initdb.d/source.sql:ro
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - lab
      - -d
      - orders
      interval: 5s
      timeout: 3s
      retries: 60
  connect:
    image: quay.io/debezium/connect:3.7.1.Final@sha256:667078edf71f67610370592ca067370044f9c289d07d014093b1f8f034fa52ce
    cpus: 0.5
    mem_limit: 1g
    networks:
    - lab
    volumes: []
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
      broker3:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092
      GROUP_ID: postgres-handoff-connect
      CONFIG_STORAGE_TOPIC: handoff-config
      OFFSET_STORAGE_TOPIC: handoff-offset
      STATUS_STORAGE_TOPIC: handoff-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_CONFIG_STORAGE_MIN_INSYNC_REPLICAS: 2
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_MIN_INSYNC_REPLICAS: 2
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_MIN_INSYNC_REPLICAS: 2
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      OFFSET_FLUSH_INTERVAL_MS: 1000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8083/connectors >/dev/null
      interval: 10s
      timeout: 5s
      retries: 60
  ch1:
    image: clickhouse/clickhouse-server:26.11.4.11@sha256:630693b4a8bce41954fe497ed371918aefe99434139d2da5786276459722fbb6
    cpus: 1.25
    mem_limit: 3584m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
    - ch1:/var/lib/clickhouse
    - ./config/server.xml:/etc/clickhouse-server/config.d/lab.xml:ro
    - ./config/users.xml:/etc/clickhouse-server/users.d/lab.xml:ro
    - ./config/replica1.xml:/etc/clickhouse-server/config.d/replica.xml:ro
    healthcheck:
      test:
      - CMD
      - clickhouse-client
      - --user
      - lab
      - --password
      - local-control-only
      - --query
      - SELECT 1
      interval: 5s
      timeout: 4s
      retries: 60
  ch2:
    image: clickhouse/clickhouse-server:26.11.4.11@sha256:630693b4a8bce41954fe497ed371918aefe99434139d2da5786276459722fbb6
    cpus: 1.25
    mem_limit: 3584m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
    - ch2:/var/lib/clickhouse
    - ./config/server.xml:/etc/clickhouse-server/config.d/lab.xml:ro
    - ./config/users.xml:/etc/clickhouse-server/users.d/lab.xml:ro
    - ./config/replica2.xml:/etc/clickhouse-server/config.d/replica.xml:ro
    healthcheck:
      test:
      - CMD
      - clickhouse-client
      - --user
      - lab
      - --password
      - local-control-only
      - --query
      - SELECT 1
      interval: 5s
      timeout: 4s
      retries: 60
  ch3:
    image: clickhouse/clickhouse-server:26.11.4.11@sha256:630693b4a8bce41954fe497ed371918aefe99434139d2da5786276459722fbb6
    cpus: 1.25
    mem_limit: 3584m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
    - ch3:/var/lib/clickhouse
    - ./config/server.xml:/etc/clickhouse-server/config.d/lab.xml:ro
    - ./config/users.xml:/etc/clickhouse-server/users.d/lab.xml:ro
    - ./config/replica3.xml:/etc/clickhouse-server/config.d/replica.xml:ro
    healthcheck:
      test:
      - CMD
      - clickhouse-client
      - --user
      - lab
      - --password
      - local-control-only
      - --query
      - SELECT 1
      interval: 5s
      timeout: 4s
      retries: 60
  keeper1:
    image: clickhouse/clickhouse-keeper:26.11.4.11@sha256:1512a05cfca9f2212325edcbf0e71114ff924025b28d11e3b58bba92623bf76b
    cpus: 0.25
    mem_limit: 512m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    volumes:
    - keeper1:/var/lib/clickhouse
    - ./config/keeper1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
  keeper2:
    image: clickhouse/clickhouse-keeper:26.11.4.11@sha256:1512a05cfca9f2212325edcbf0e71114ff924025b28d11e3b58bba92623bf76b
    cpus: 0.25
    mem_limit: 512m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    volumes:
    - keeper2:/var/lib/clickhouse
    - ./config/keeper2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
  keeper3:
    image: clickhouse/clickhouse-keeper:26.11.4.11@sha256:1512a05cfca9f2212325edcbf0e71114ff924025b28d11e3b58bba92623bf76b
    cpus: 0.25
    mem_limit: 512m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    volumes:
    - keeper3:/var/lib/clickhouse
    - ./config/keeper3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
  orders-workload:
    build: ./orders-workload
    image: examples/postgres-handoff-workload:1
    cpus: 0.5
    mem_limit: 512m
    networks:
    - lab
    cap_drop:
    - ALL
    read_only: true
    volumes:
    - ./results:/results
    environment:
      ORDER_COUNT: ${ORDER_COUNT:-1000000}
      CUSTOMER_COUNT: ${CUSTOMER_COUNT:-10000}
      SOURCE_URL: postgres://app:local-app-only@postgres:5432/orders?sslmode=disable
      AWS_EC2_METADATA_DISABLED: 'true'
    command:
    - idle
    stop_grace_period: 30s
networks:
  lab:
    internal: true
    ipam:
      config:
      - subnet: 172.30.71.0/24
volumes:
  controller1: null
  controller2: null
  controller3: null
  broker1: null
  broker2: null
  broker3: null
  postgres: null
  ch1: null
  ch2: null
  ch3: null
  keeper1: null
  keeper2: null
  keeper3: null
