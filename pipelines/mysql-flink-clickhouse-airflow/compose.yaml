name: mysql-flink-clickhouse-airflow
x-flink-environment: &flink-environment
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    jobmanager.memory.process.size: 768m
    taskmanager.memory.process.size: 1280m
    taskmanager.numberOfTaskSlots: 1
    parallelism.default: 2
    rest.address: jobmanager
    rest.bind-address: 0.0.0.0
    state.backend.type: rocksdb
    state.backend.incremental: true
    state.checkpoints.num-retained: 2
    state.backend.rocksdb.localdir: /rocksdb
    state.checkpoints.dir: file:///data/checkpoints
    execution.checkpointing.interval: 5s
    execution.checkpointing.timeout: 120s
    execution.checkpointing.min-pause: 1s
    execution.checkpointing.max-concurrent-checkpoints: 1
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: 10
    restart-strategy.fixed-delay.delay: 5s
x-airflow-environment: &airflow-environment
  SOURCE_DSN: app:local-app-only@tcp(mysql:3306)/orders?timeout=5s&readTimeout=60s&writeTimeout=30s&parseTime=true
  ORDER_COUNT: ${ORDER_COUNT:-1000000}
  CUSTOMER_COUNT: ${CUSTOMER_COUNT:-10000}
  AWS_EC2_METADATA_DISABLED: 'true'
  GOMAXPROCS: '1'
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: '2'
  AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: '2'
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:local-airflow-only@airflow-db:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__PARALLELISM: '1'
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
  AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
  AIRFLOW__API_AUTH__JWT_SECRET: local-margins-jwt-key-not-for-production-000000000000
  AIRFLOW__API_AUTH__JWT_ISSUER: airflow
  AIRFLOW__API__SECRET_KEY: local-margins-api-key-not-for-production-000000000000
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  AIRFLOW__API__WORKERS: '1'
  AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: '1'
services:
  controller1:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: &id001
    - lab
    stop_grace_period: 30s
    mem_limit: 384m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
      KAFKA_NODE_ID: 1
    volumes:
    - controller1:/var/lib/kafka/data
    - controller1-image-etc-kafka-secrets:/etc/kafka/secrets
    - controller1-image-mnt-shared-config:/mnt/shared/config
  controller2:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 384m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
      KAFKA_NODE_ID: 2
    volumes:
    - controller2:/var/lib/kafka/data
    - controller2-image-etc-kafka-secrets:/etc/kafka/secrets
    - controller2-image-mnt-shared-config:/mnt/shared/config
  controller3:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 384m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
      KAFKA_NODE_ID: 3
    volumes:
    - controller3:/var/lib/kafka/data
    - controller3-image-etc-kafka-secrets:/etc/kafka/secrets
    - controller3-image-mnt-shared-config:/mnt/shared/config
  broker1:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 512m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_NODE_ID: 4
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092
    volumes:
    - broker1:/var/lib/kafka/data
    - broker1-image-etc-kafka-secrets:/etc/kafka/secrets
    - broker1-image-mnt-shared-config:/mnt/shared/config
    healthcheck:
      test:
      - CMD-SHELL
      - KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        >/dev/null
      interval: 15s
      timeout: 20s
      retries: 30
  broker2:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 512m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_NODE_ID: 5
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092
    volumes:
    - broker2:/var/lib/kafka/data
    - broker2-image-mnt-shared-config:/mnt/shared/config
    - broker2-image-etc-kafka-secrets:/etc/kafka/secrets
    healthcheck:
      test:
      - CMD-SHELL
      - KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        >/dev/null
      interval: 15s
      timeout: 20s
      retries: 30
  broker3:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    networks: *id001
    stop_grace_period: 30s
    mem_limit: 512m
    environment:
      CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
      KAFKA_PROCESS_ROLES: broker
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_NODE_ID: 6
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker3:9092
    volumes:
    - broker3:/var/lib/kafka/data
    - broker3-image-etc-kafka-secrets:/etc/kafka/secrets
    - broker3-image-mnt-shared-config:/mnt/shared/config
    healthcheck:
      test:
      - CMD-SHELL
      - KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        >/dev/null
      interval: 15s
      timeout: 20s
      retries: 30
  connect:
    image: quay.io/debezium/connect:3.7.1.Final@sha256:667078edf71f67610370592ca067370044f9c289d07d014093b1f8f034fa52ce
    cpus: 0.5
    mem_limit: 1g
    networks:
    - lab
    volumes:
    - connect-image-kafka-config:/kafka/config
    - connect-image-kafka-data:/kafka/data
    - connect-image-kafka-logs:/kafka/logs
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
      broker3:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092
      GROUP_ID: mysql-margins-connect
      CONFIG_STORAGE_TOPIC: margins-config
      OFFSET_STORAGE_TOPIC: margins-offset
      STATUS_STORAGE_TOPIC: margins-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_CONFIG_STORAGE_MIN_INSYNC_REPLICAS: 2
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_MIN_INSYNC_REPLICAS: 2
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_MIN_INSYNC_REPLICAS: 2
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      OFFSET_FLUSH_INTERVAL_MS: 1000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      PLUGIN_PATH: /kafka/connect/debezium-connector-mysql
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8083/connectors >/dev/null
      interval: 10s
      timeout: 5s
      retries: 60
  ch1:
    image: clickhouse/clickhouse-server:26.11.4.11@sha256:630693b4a8bce41954fe497ed371918aefe99434139d2da5786276459722fbb6
    cpus: 0.75
    mem_limit: 2304m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
    - ch1:/var/lib/clickhouse
    - ./config/server.xml:/etc/clickhouse-server/config.d/lab.xml:ro
    - ./config/users.xml:/etc/clickhouse-server/users.d/lab.xml:ro
    - ./config/replica1.xml:/etc/clickhouse-server/config.d/replica.xml:ro
    healthcheck:
      test:
      - CMD
      - clickhouse-client
      - --user
      - lab
      - --password
      - local-control-only
      - --query
      - SELECT 1
      interval: 5s
      timeout: 4s
      retries: 60
  ch2:
    image: clickhouse/clickhouse-server:26.11.4.11@sha256:630693b4a8bce41954fe497ed371918aefe99434139d2da5786276459722fbb6
    cpus: 0.75
    mem_limit: 2304m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
    - ch2:/var/lib/clickhouse
    - ./config/server.xml:/etc/clickhouse-server/config.d/lab.xml:ro
    - ./config/users.xml:/etc/clickhouse-server/users.d/lab.xml:ro
    - ./config/replica2.xml:/etc/clickhouse-server/config.d/replica.xml:ro
    healthcheck:
      test:
      - CMD
      - clickhouse-client
      - --user
      - lab
      - --password
      - local-control-only
      - --query
      - SELECT 1
      interval: 5s
      timeout: 4s
      retries: 60
  ch3:
    image: clickhouse/clickhouse-server:26.11.4.11@sha256:630693b4a8bce41954fe497ed371918aefe99434139d2da5786276459722fbb6
    cpus: 0.75
    mem_limit: 2304m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
    - ch3:/var/lib/clickhouse
    - ./config/server.xml:/etc/clickhouse-server/config.d/lab.xml:ro
    - ./config/users.xml:/etc/clickhouse-server/users.d/lab.xml:ro
    - ./config/replica3.xml:/etc/clickhouse-server/config.d/replica.xml:ro
    healthcheck:
      test:
      - CMD
      - clickhouse-client
      - --user
      - lab
      - --password
      - local-control-only
      - --query
      - SELECT 1
      interval: 5s
      timeout: 4s
      retries: 60
  keeper1:
    image: clickhouse/clickhouse-keeper:26.11.4.11@sha256:1512a05cfca9f2212325edcbf0e71114ff924025b28d11e3b58bba92623bf76b
    cpus: 0.125
    mem_limit: 384m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    volumes:
    - keeper1:/var/lib/clickhouse
    - ./config/keeper1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    - keeper1-image-var-lib-clickhouse-keeper:/var/lib/clickhouse-keeper
  keeper2:
    image: clickhouse/clickhouse-keeper:26.11.4.11@sha256:1512a05cfca9f2212325edcbf0e71114ff924025b28d11e3b58bba92623bf76b
    cpus: 0.125
    mem_limit: 384m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    volumes:
    - keeper2:/var/lib/clickhouse
    - ./config/keeper2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    - keeper2-image-var-lib-clickhouse-keeper:/var/lib/clickhouse-keeper
  keeper3:
    image: clickhouse/clickhouse-keeper:26.11.4.11@sha256:1512a05cfca9f2212325edcbf0e71114ff924025b28d11e3b58bba92623bf76b
    cpus: 0.125
    mem_limit: 384m
    networks:
    - lab
    cap_drop:
    - ALL
    user: 101:101
    volumes:
    - keeper3:/var/lib/clickhouse
    - ./config/keeper3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    - keeper3-image-var-lib-clickhouse-keeper:/var/lib/clickhouse-keeper
  orders-workload:
    user: ${LAB_UID:-1000}:0
    build: ./orders-workload
    image: examples/mysql-margins-workload:1
    cpus: 0.5
    mem_limit: 512m
    networks:
    - lab
    cap_drop:
    - ALL
    read_only: true
    volumes:
    - ./results:/results
    environment:
      SOURCE_DSN: app:local-app-only@tcp(mysql:3306)/orders?timeout=5s&readTimeout=60s&writeTimeout=30s&parseTime=true
      ORDER_COUNT: ${ORDER_COUNT:-1000000}
      CUSTOMER_COUNT: ${CUSTOMER_COUNT:-10000}
      AWS_EC2_METADATA_DISABLED: 'true'
      GOMAXPROCS: '1'
    command:
    - idle
    stop_grace_period: 30s
  mysql:
    image: mysql:9.7.4.1@sha256:1f2ca53a9e94ff9f1f313099fa7dc7fb2f72e180ca5b2ef83574031e451bbbf1
    cpus: 0.75
    mem_limit: 1024m
    networks:
    - lab
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: orders
    command:
    - --server-id=18101
    - --log-bin=binlog
    - --binlog-format=ROW
    - --binlog-row-image=FULL
    - --gtid-mode=ON
    - --enforce-gtid-consistency=ON
    - --binlog-expire-logs-seconds=7200
    - --innodb-buffer-pool-size=268435456
    - --max-connections=32
    - --innodb-flush-log-at-trx-commit=1
    - --sync-binlog=1
    volumes:
    - mysql:/var/lib/mysql
    - ./sql/source.sql:/docker-entrypoint-initdb.d/source.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD=local-root-only mysqladmin ping -h127.0.0.1 -uroot --silent
      interval: 5s
      timeout: 4s
      retries: 60
  jobmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    image: examples/mysql-margins-flink:2.3.0
    networks:
    - lab
    volumes:
    - flink-state:/data
    - ./sql:/sql:ro
    environment: *flink-environment
    command:
    - jobmanager
    cpus: 0.5
    mem_limit: 1024m
    healthcheck:
      test:
      - CMD-SHELL
      - test -n "$(pgrep -f '[o]rg.apache.flink')"
      interval: 10s
      timeout: 4s
      retries: 60
  taskmanager1:
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    image: examples/mysql-margins-flink:2.3.0
    networks:
    - lab
    volumes:
    - flink-state:/data
    - ./sql:/sql:ro
    - taskmanager1-rocks:/rocksdb
    environment: *flink-environment
    command:
    - taskmanager
    cpus: 0.75
    mem_limit: 1536m
    healthcheck:
      test:
      - CMD-SHELL
      - test -n "$(pgrep -f '[o]rg.apache.flink')"
      interval: 10s
      timeout: 4s
      retries: 60
  taskmanager2:
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    image: examples/mysql-margins-flink:2.3.0
    networks:
    - lab
    volumes:
    - flink-state:/data
    - ./sql:/sql:ro
    - taskmanager2-rocks:/rocksdb
    environment: *flink-environment
    command:
    - taskmanager
    cpus: 0.75
    mem_limit: 1536m
    healthcheck:
      test:
      - CMD-SHELL
      - test -n "$(pgrep -f '[o]rg.apache.flink')"
      interval: 10s
      timeout: 4s
      retries: 60
  sql-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    image: examples/mysql-margins-flink:2.3.0
    networks:
    - lab
    volumes:
    - flink-state:/data
    - ./sql:/sql:ro
    - ./scripts/finish-tool.sh:/opt/lab/finish-tool.sh:ro
    environment: *flink-environment
    command:
    - /opt/flink/bin/sql-client.sh
    - -Drest.address=jobmanager
    - -Djobmanager.rpc.address=jobmanager
    - -f
    - /sql/pipeline.sql
    cpus: 0.5
    mem_limit: 768m
    profiles:
    - tools
    entrypoint:
    - /bin/sh
    - /opt/lab/finish-tool.sh
  state-init:
    image: examples/mysql-margins-flink:2.3.0
    user: 0:0
    cpus: 0.1
    mem_limit: 64m
    profiles:
    - tools
    network_mode: none
    volumes:
    - flink-state:/data
    - taskmanager1-rocks:/tm1
    - taskmanager2-rocks:/tm2
    - ./scripts/finish-tool.sh:/opt/lab/finish-tool.sh:ro
    entrypoint:
    - /bin/sh
    - /opt/lab/finish-tool.sh
    command:
    - sh
    - -c
    - mkdir -p /data/checkpoints /tm1 /tm2 && chown -R flink:flink /data /tm1 /tm2
  airflow-api:
    user: ${LAB_UID:-1000}:0
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: examples/mysql-margins-airflow:3.4.0
    networks:
    - lab
    environment: *airflow-environment
    volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
    - ./results:/results
