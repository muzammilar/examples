name: orders-cdc-analytics
x-fe: &fe
  build: {context: ., dockerfile: docker/Dockerfile.fe}
  image: examples/orders-cdc-fe:4.1.5
  cpus: 0.5
  mem_limit: 1280m
  networks: [lab]
  healthcheck:
    test: [CMD-SHELL, "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW FRONTENDS'"]
    interval: 10s
    timeout: 5s
    retries: 60
x-fe-env: &fe-env
  FE_SERVERS: fe1:172.30.67.11:9010,fe2:172.30.67.12:9010,fe3:172.30.67.13:9010
x-be: &be
  build: {context: ., dockerfile: docker/Dockerfile.be}
  image: examples/orders-cdc-be:4.1.5
  cpus: 1
  mem_limit: 2816m
  networks: [lab]
  depends_on:
    fe1: {condition: service_healthy}
    fe2: {condition: service_healthy}
    fe3: {condition: service_healthy}
  healthcheck:
    test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/127.0.0.1/9060'"]
    interval: 10s
    timeout: 5s
    retries: 60
x-kafka: &kafka
  image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
  cpus: 0.25
  networks: [lab]
  stop_grace_period: 30s
x-controller-env: &controller-env
  CLUSTER_ID: B0kTQc3XQRaWpyGcaFG-JA
  KAFKA_PROCESS_ROLES: controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
x-broker-env: &broker-env
  <<: *controller-env
  KAFKA_PROCESS_ROLES: broker
  KAFKA_LISTENERS: PLAINTEXT://:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_NUM_NETWORK_THREADS: 2
  KAFKA_NUM_IO_THREADS: 4
x-flink: &flink
  build: {context: ., dockerfile: docker/Dockerfile.flink}
  image: examples/orders-cdc-flink:2.3.0
  cpus: 1
  mem_limit: 1536m
  networks: [lab]
  volumes: [flink-state:/data]
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 1280m
      taskmanager.numberOfTaskSlots: 1
      parallelism.default: 2
      rest.address: jobmanager
      rest.bind-address: 0.0.0.0
      state.backend.type: rocksdb
      state.checkpoints.dir: file:///data/checkpoints
      execution.checkpointing.interval: 5s
      execution.checkpointing.timeout: 120s
      execution.checkpointing.min-pause: 1s
      execution.checkpointing.max-concurrent-checkpoints: 1
      restart-strategy.type: fixed-delay
      restart-strategy.fixed-delay.attempts: 20
      restart-strategy.fixed-delay.delay: 5s
services:
  fe1:
    <<: *fe
    environment: {<<: *fe-env, FE_ID: '1'}
    networks: {lab: {ipv4_address: 172.30.67.11}}
    volumes: [fe1-meta:/opt/apache-doris/fe/doris-meta]
  fe2:
    <<: *fe
    environment: {<<: *fe-env, FE_ID: '2'}
    networks: {lab: {ipv4_address: 172.30.67.12}}
    volumes: [fe2-meta:/opt/apache-doris/fe/doris-meta]
    depends_on: {fe1: {condition: service_healthy}}
  fe3:
    <<: *fe
    environment: {<<: *fe-env, FE_ID: '3'}
    networks: {lab: {ipv4_address: 172.30.67.13}}
    volumes: [fe3-meta:/opt/apache-doris/fe/doris-meta]
    depends_on: {fe1: {condition: service_healthy}}
  be1:
    <<: *be
    environment: {<<: *fe-env, BE_ADDR: '172.30.67.21:9050'}
    networks: {lab: {ipv4_address: 172.30.67.21}}
    volumes: [be1-data:/opt/apache-doris/be/storage]
  be2:
    <<: *be
    environment: {<<: *fe-env, BE_ADDR: '172.30.67.22:9050'}
    networks: {lab: {ipv4_address: 172.30.67.22}}
    volumes: [be2-data:/opt/apache-doris/be/storage]
  be3:
    <<: *be
    environment: {<<: *fe-env, BE_ADDR: '172.30.67.23:9050'}
    networks: {lab: {ipv4_address: 172.30.67.23}}
    volumes: [be3-data:/opt/apache-doris/be/storage]
  controller1:
    <<: *kafka
    mem_limit: 384m
    environment: {<<: *controller-env, KAFKA_NODE_ID: 1}
    volumes: [controller1:/var/lib/kafka/data]
  controller2:
    <<: *kafka
    mem_limit: 384m
    environment: {<<: *controller-env, KAFKA_NODE_ID: 2}
    volumes: [controller2:/var/lib/kafka/data]
  controller3:
    <<: *kafka
    mem_limit: 384m
    environment: {<<: *controller-env, KAFKA_NODE_ID: 3}
    volumes: [controller3:/var/lib/kafka/data]
  broker1:
    <<: *kafka
    mem_limit: 512m
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 4
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092
    volumes: [broker1:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, 'KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null']
      interval: 15s
      timeout: 20s
      retries: 30
  broker2:
    <<: *kafka
    mem_limit: 512m
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 5
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092
    volumes: [broker2:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, 'KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null']
      interval: 15s
      timeout: 20s
      retries: 30
  broker3:
    <<: *kafka
    mem_limit: 512m
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 6
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker3:9092
    volumes: [broker3:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, 'KAFKA_HEAP_OPTS="-Xms32m -Xmx64m" /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null']
      interval: 15s
      timeout: 20s
      retries: 30
  postgres:
    image: postgres:18.7@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    cpus: 0.5
    mem_limit: 512m
    networks: [lab]
    environment: {POSTGRES_DB: orders, POSTGRES_USER: lab, POSTGRES_PASSWORD: local-pipeline-only}
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4, -c, max_slot_wal_keep_size=1GB]
    volumes: [postgres:/var/lib/postgresql, './config/source.sql:/docker-entrypoint-initdb.d/source.sql:ro']
    healthcheck:
      test: [CMD, pg_isready, -U, lab, -d, orders]
      interval: 5s
      timeout: 3s
      retries: 60
  connect:
    image: quay.io/debezium/connect:3.7.1.Final@sha256:551e039eb9677a11bb1add0e561939530f8d3f25b0c4331979175bb430f6dc74
    cpus: 0.5
    mem_limit: 1g
    networks: [lab]
    volumes: ['./config/debezium.json:/opt/lab/connector.json:ro']
    depends_on:
      broker1: {condition: service_healthy}
      broker2: {condition: service_healthy}
      broker3: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: broker1:9092,broker2:9092,broker3:9092
      GROUP_ID: orders-cdc
      CONFIG_STORAGE_TOPIC: pipeline-config
      OFFSET_STORAGE_TOPIC: pipeline-offset
      STATUS_STORAGE_TOPIC: pipeline-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_CONFIG_STORAGE_MIN_INSYNC_REPLICAS: 2
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_MIN_INSYNC_REPLICAS: 2
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_MIN_INSYNC_REPLICAS: 2
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      OFFSET_FLUSH_INTERVAL_MS: 1000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8083/connectors >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 60
  jobmanager:
    <<: *flink
    command: jobmanager
    healthcheck:
      test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 5s
      timeout: 3s
      retries: 60
  taskmanager:
    <<: *flink
    command: taskmanager
    deploy: {replicas: 2}
    depends_on: {jobmanager: {condition: service_healthy}}
  sql:
    <<: *flink
    volumes: [flink-state:/data, './sql:/opt/lab/sql:ro']
    cpus: 0.5
    mem_limit: 768m
    profiles: [tools]
    entrypoint: /opt/flink/bin/sql-client.sh
    command: [-Drest.address=jobmanager, -Djobmanager.rpc.address=jobmanager, -f, /opt/lab/sql/pipeline.sql]
  orders:
    build: orders-workload
    image: examples/orders-cdc-workload:1
    cpus: 0.5
    mem_limit: 512m
    networks: [lab]
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp:size=16m]
    volumes: ['./results:/results']
    environment: {ORDER_COUNT: '${ORDER_COUNT:-1000000}', CUSTOMER_COUNT: '${CUSTOMER_COUNT:-10000}'}
    command: [idle]
volumes:
  flink-state:
  postgres:
  controller1:
  controller2:
  controller3:
  broker1:
  broker2:
  broker3:
  fe1-meta:
  fe2-meta:
  fe3-meta:
  be1-data:
  be2-data:
  be3-data:
networks:
  lab:
    internal: true
    ipam:
      config: [{subnet: 172.30.67.0/24, ip_range: 172.30.67.128/25}]
