    - "-ip=volume2"
    - "-ip.bind=0.0.0.0"
    - "-port=8080"
    - "-dir=/data"
    - "-master=master1:9333,master2:9333,master3:9333"
    - "-max=16"
    - "-dataCenter=zone2"
    - "-rack=rack2"
    - "-minFreeSpace=1GiB"
    healthcheck:
      test:
      - CMD
      - wget
      - "-q"
      - "-O"
      - "/dev/null"
      - http://127.0.0.1:8080/healthz
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
      master3:
        condition: service_healthy
    volumes:
    - volume2:/data
  master3:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    cpus: 0.125
    mem_limit: 192m
    networks:
    - lab
    hostname: master3
    command:
    - master
    - "-ip=master3"
    - "-ip.bind=0.0.0.0"
    - "-mdir=/data"
    - "-peers=master1:9333,master2:9333,master3:9333"
    - "-volumeSizeLimitMB=64"
    - "-defaultReplication=200"
    healthcheck:
      test:
