  filer1:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    cpus: 0.25
    mem_limit: 384m
    networks:
    - lab
    hostname: filer1
    command:
    - filer
    - "-ip=filer1"
    - "-ip.bind=0.0.0.0"
    - "-master=master1:9333,master2:9333,master3:9333"
    - "-defaultReplicaPlacement=200"
    - "-maxMB=2"
    volumes:
    - "./deploy/seaweed/filer.toml:/etc/seaweedfs/filer.toml:ro"
    healthcheck:
      test:
      - CMD
      - wget
      - "-q"
      - "-O"
      - "/dev/null"
      - http://127.0.0.1:8888/healthz
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
  filer2:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    cpus: 0.25
