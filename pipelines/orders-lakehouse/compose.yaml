    command:
    - filer
    - "-ip=filer2"
    - "-ip.bind=0.0.0.0"
    - "-master=master1:9333,master2:9333,master3:9333"
    - "-defaultReplicaPlacement=200"
    - "-maxMB=2"
    volumes:
    - "./deploy/seaweed/filer.toml:/etc/seaweedfs/filer.toml:ro"
    healthcheck:
      test:
      - CMD
      - wget
      - "-q"
      - "-O"
      - "/dev/null"
      - http://127.0.0.1:8888/healthz
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
  s3:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    cpus: 0.125
    mem_limit: 256m
    networks:
    - lab
    command:
    - s3
    - "-ip.bind=0.0.0.0"
    - "-port=8333"
    - "-filer=filer1:8888,filer2:8888"
    - "-config=/etc/seaweedfs/s3.json"
    - "-cacheCapacityMB=0"
    - "-port.iceberg=0"
    - "-port.lance=0"
    volumes:
    - "./deploy/seaweed/s3.json:/etc/seaweedfs/s3.json:ro"
    healthcheck:
      test:
      - CMD
      - wget
      - "-q"
      - "-O"
      - "/dev/null"
      - http://127.0.0.1:8333/status
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      filer1:
        condition: service_healthy
      filer2:
        condition: service_healthy
  controller1:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.125
    mem_limit: 384m
    networks:
    - lab
    environment:
      CLUSTER_ID: R3LkX9xjRkKybvE8y3UfPQ
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"
    stop_grace_period: 30s
    volumes:
    - controller1:/var/lib/kafka/data
  broker1:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.25
    mem_limit: 768m
    networks:
    - lab
    environment:
      CLUSTER_ID: R3LkX9xjRkKybvE8y3UfPQ
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false'
      KAFKA_LOG_PREALLOCATE: 'false'
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
    stop_grace_period: 30s
    volumes:
    - broker1:/var/lib/kafka/data
  controller2:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    cpus: 0.125
