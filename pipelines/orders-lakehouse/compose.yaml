      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
    stop_grace_period: 30s
    volumes:
    - broker3:/var/lib/kafka/data
  catalog-db:
    image: postgres:19.0@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
    cpus: 0.25
    mem_limit: 768m
    networks:
    - lab
    environment:
      POSTGRES_USER: lake
      POSTGRES_PASSWORD: local-catalog-only
      POSTGRES_DB: lake
    healthcheck:
      test:
      - CMD
      - pg_isready
      - "-U"
      - lake
      - "-d"
      - lake
      interval: 3s
      timeout: 3s
      retries: 60
    volumes:
    - catalog-db:/var/lib/postgresql
  jobmanager:
    image: examples/orders-lakehouse-flink:2.3.0
    cpus: 0.5
    mem_limit: 1280m
    networks:
    - lab
    build:
      context: "."
      dockerfile: docker/Dockerfile.flink
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 1
        parallelism.default: 2
        rest.address: jobmanager
        rest.bind-address: 0.0.0.0
        state.backend.type: rocksdb
        state.checkpoints.dir: file:///state/checkpoints
        execution.checkpointing.max-concurrent-checkpoints: 1
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 20
        restart-strategy.fixed-delay.delay: 5s
      AWS_EC2_METADATA_DISABLED: 'true'
    command:
    - jobmanager
    volumes:
    - flink-state:/state
  taskmanager1:
    image: examples/orders-lakehouse-flink:2.3.0
    cpus: 1
    mem_limit: 1536m
    networks:
    - lab
    build:
      context: "."
      dockerfile: docker/Dockerfile.flink
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 1
        parallelism.default: 2
        rest.address: jobmanager
        rest.bind-address: 0.0.0.0
        state.backend.type: rocksdb
        state.checkpoints.dir: file:///state/checkpoints
        execution.checkpointing.max-concurrent-checkpoints: 1
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 20
        restart-strategy.fixed-delay.delay: 5s
        taskmanager.host: taskmanager1
      AWS_EC2_METADATA_DISABLED: 'true'
    command:
    - taskmanager
    volumes:
