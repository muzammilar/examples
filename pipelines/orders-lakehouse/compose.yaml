---
name: orders-lakehouse
services:
  master1:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    cpus: 0.125
    mem_limit: 192m
    networks:
    - lab
    hostname: master1
    command:
    - master
    - "-ip=master1"
    - "-ip.bind=0.0.0.0"
    - "-mdir=/data"
    - "-peers=master1:9333,master2:9333,master3:9333"
    - "-volumeSizeLimitMB=64"
    - "-defaultReplication=200"
    healthcheck:
      test:
      - CMD
      - wget
      - "-q"
      - "-O"
      - "/dev/null"
      - http://127.0.0.1:9333/healthz
      interval: 3s
      timeout: 3s
      retries: 60
    volumes:
    - master1:/data
  etcd1:
    image: gcr.io/etcd-development/etcd:v3.7.4@sha256:47d217be8ec4ca943954b5f4bf8029ee9bc0ffb05fbe2a44d579a1f640e03ed4
    cpus: 0.25
    mem_limit: 384m
    networks:
    - lab
    hostname: etcd1
    entrypoint:
    - "/usr/local/bin/etcd"
    command:
    - "--name=etcd1"
    - "--data-dir=/data"
    - "--listen-client-urls=http://0.0.0.0:2379"
    - "--advertise-client-urls=http://etcd1:2379"
    - "--listen-peer-urls=http://0.0.0.0:2380"
    - "--initial-advertise-peer-urls=http://etcd1:2380"
    - "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380"
    - "--initial-cluster-token=orders-lakehouse"
    - "--auto-compaction-retention=1"
    healthcheck:
      test:
      - CMD
      - "/usr/local/bin/etcdctl"
      - endpoint
      - health
      interval: 3s
      timeout: 3s
      retries: 60
    volumes:
    - etcd1:/data
  volume1:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    cpus: 0.25
    mem_limit: 256m
    networks:
    - lab
    hostname: volume1
    command:
    - volume
    - "-ip=volume1"
    - "-ip.bind=0.0.0.0"
    - "-port=8080"
    - "-dir=/data"
    - "-master=master1:9333,master2:9333,master3:9333"
    - "-max=16"
    - "-dataCenter=zone1"
    - "-rack=rack1"
    - "-minFreeSpace=1GiB"
    healthcheck:
      test:
      - CMD
      - wget
      - "-q"
      - "-O"
      - "/dev/null"
      - http://127.0.0.1:8080/healthz
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      master1:
        condition: service_healthy
      master2:
        condition: service_healthy
      master3:
        condition: service_healthy
    volumes:
    - volume1:/data
  master2:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    cpus: 0.125
    mem_limit: 192m
    networks:
    - lab
    hostname: master2
    command:
    - master
    - "-ip=master2"
    - "-ip.bind=0.0.0.0"
    - "-mdir=/data"
    - "-peers=master1:9333,master2:9333,master3:9333"
    - "-volumeSizeLimitMB=64"
    - "-defaultReplication=200"
    healthcheck:
      test:
      - CMD
      - wget
      - "-q"
      - "-O"
      - "/dev/null"
      - http://127.0.0.1:9333/healthz
      interval: 3s
      timeout: 3s
      retries: 60
    volumes:
    - master2:/data
  etcd2:
    image: gcr.io/etcd-development/etcd:v3.7.4@sha256:47d217be8ec4ca943954b5f4bf8029ee9bc0ffb05fbe2a44d579a1f640e03ed4
    cpus: 0.25
    mem_limit: 384m
    networks:
    - lab
    hostname: etcd2
    entrypoint:
    - "/usr/local/bin/etcd"
    command:
    - "--name=etcd2"
    - "--data-dir=/data"
    - "--listen-client-urls=http://0.0.0.0:2379"
    - "--advertise-client-urls=http://etcd2:2379"
    - "--listen-peer-urls=http://0.0.0.0:2380"
    - "--initial-advertise-peer-urls=http://etcd2:2380"
    - "--initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380"
    - "--initial-cluster-token=orders-lakehouse"
    - "--auto-compaction-retention=1"
    healthcheck:
      test:
      - CMD
      - "/usr/local/bin/etcdctl"
      - endpoint
      - health
      interval: 3s
      timeout: 3s
      retries: 60
    volumes:
    - etcd2:/data
  volume2:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
