# Spreads client connections across however many nodes are running. Nodes
# that aren't (node4 and node5 in a three-node cluster) are marked down by
# the health checks and skipped.

global
    log stdout format raw local0

defaults
    mode tcp
    log global
    timeout connect 2s
    # Connections are long-lived; the server closes idle ones itself.
    timeout client 10m
    timeout server 10m

# Docker's DNS: a node's address is looked up again when it restarts.
resolvers docker
    nameserver dns 127.0.0.11:53

frontend jobs
    bind :5555
    default_backend orchestrators

backend orchestrators
    balance roundrobin
    default-server check inter 1s fall 1 rise 2 resolvers docker init-addr none
    server node1 node1:5555
    server node2 node2:5555
    server node3 node3:5555
    server node4 node4:5555
    server node5 node5:5555
