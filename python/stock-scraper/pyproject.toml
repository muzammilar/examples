[project]
name = "stock-scraper"
version = "0.1.0"
description = "Scrape stock tickers from websites with Selenium and a persistent browser profile"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "selenium>=4.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
