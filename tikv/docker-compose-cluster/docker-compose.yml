name: tikv-cluster

# TiKV on its own, no TiDB: 3 PD (placement driver: metadata, TSO timestamps,
# scheduling) and 3 TiKV stores (Raft-replicated regions, 3 replicas each). Both
# images are multi-arch (amd64 + arm64). The Go demo client (client/, built with
# tikv/client-go) talks to PD for routing and TSO and to TiKV directly for data.
# Only one PD client port is published to the host.
x-pd: &pd
  image: pingcap/pd:${TIKV_VERSION:-v8.5.8}
  healthcheck:
    # /pd/api/v1/leader answers only once the PD Raft group elected a leader
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2379/pd/api/v1/leader"]
    interval: 3s
    timeout: 3s
    retries: 40

x-tikv: &tikv
  image: pingcap/tikv:${TIKV_VERSION:-v8.5.8}
  ulimits:
    nofile: { soft: 1000000, hard: 1000000 }
  volumes: [./config/tikv.toml:/tikv.toml:ro]
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20180/status"]
    interval: 3s
    timeout: 3s
    retries: 40
  depends_on:
    pd0: { condition: service_healthy }
    pd1: { condition: service_healthy }
    pd2: { condition: service_healthy }

services:
  pd0:
    <<: *pd
    container_name: tikv-pd0
    hostname: pd0
    command:
      - --name=pd0
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd0:2379
      - --advertise-peer-urls=http://pd0:2380
      - --initial-cluster=pd0=http://pd0:2380,pd1=http://pd1:2380,pd2=http://pd2:2380
      - --data-dir=/data/pd
    ports: ["${PD_PORT:-22379}:2379"]
  pd1:
    <<: *pd
    container_name: tikv-pd1
    hostname: pd1
    command:
      - --name=pd1
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd1:2379
      - --advertise-peer-urls=http://pd1:2380
      - --initial-cluster=pd0=http://pd0:2380,pd1=http://pd1:2380,pd2=http://pd2:2380
      - --data-dir=/data/pd
  pd2:
    <<: *pd
    container_name: tikv-pd2
    hostname: pd2
    command:
      - --name=pd2
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd2:2379
      - --advertise-peer-urls=http://pd2:2380
      - --initial-cluster=pd0=http://pd0:2380,pd1=http://pd1:2380,pd2=http://pd2:2380
      - --data-dir=/data/pd

  tikv0:
    <<: *tikv
    container_name: tikv-tikv0
    hostname: tikv0
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv0:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv0:20180
      - --pd=pd0:2379,pd1:2379,pd2:2379
      - --data-dir=/data/tikv
      - --config=/tikv.toml
  tikv1:
    <<: *tikv
    container_name: tikv-tikv1
    hostname: tikv1
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv1:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv1:20180
      - --pd=pd0:2379,pd1:2379,pd2:2379
      - --data-dir=/data/tikv
      - --config=/tikv.toml
  tikv2:
    <<: *tikv
    container_name: tikv-tikv2
    hostname: tikv2
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv2:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-status-addr=tikv2:20180
      - --pd=pd0:2379,pd1:2379,pd2:2379
      - --data-dir=/data/tikv
      - --config=/tikv.toml


  # demo client: `make test` runs it once with `docker compose run --rm client`
  client:
    build: ./client
    image: tikv-cluster-demo-client:local
    profiles: [client]
    environment:
      PD_ADDRS: pd0:2379,pd1:2379,pd2:2379
