name: ${COMPOSE_PROJECT_NAME:-garage-s3-cluster}
x-garage: &garage
  image: ${GARAGE_IMAGE:-dxflrs/garage:v2.6.0@sha256:4b5a318fc9fe2fbec5d3af590eeafe05d83492e6411266fa0b9e215c20264013}
  command: [/garage, server]
  cpus: 1
  mem_limit: 768m
  healthcheck:
    test: [CMD, /garage, status]
    interval: 5s
    timeout: 10s
    retries: 60
    start_period: 10s
services:
  garage0:
    <<: *garage
    hostname: garage0
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/garage0.toml:/etc/garage.toml:ro
      - meta0:/meta
      - data0:/data
  garage1:
    <<: *garage
    hostname: garage1
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/garage1.toml:/etc/garage.toml:ro
      - meta1:/meta
      - data1:/data
  garage2:
    <<: *garage
    hostname: garage2
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/garage2.toml:/etc/garage.toml:ro
      - meta2:/meta
      - data2:/data
  garage3:
    <<: *garage
    hostname: garage3
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/garage3.toml:/etc/garage.toml:ro
      - meta3:/meta
      - data3:/data
  garage4:
    <<: *garage
    hostname: garage4
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/garage4.toml:/etc/garage.toml:ro
      - meta4:/meta
      - data4:/data
  garage5:
    <<: *garage
    hostname: garage5
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/garage5.toml:/etc/garage.toml:ro
      - meta5:/meta
      - data5:/data
  garage6:
    <<: *garage
    hostname: garage6
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/garage6.toml:/etc/garage.toml:ro
      - meta6:/meta
      - data6:/data
  garage7:
    <<: *garage
    hostname: garage7
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/garage7.toml:/etc/garage.toml:ro
      - meta7:/meta
      - data7:/data
  garage8:
    <<: *garage
    hostname: garage8
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/garage8.toml:/etc/garage.toml:ro
      - meta8:/meta
      - data8:/data
  s3:
    image: haproxy:3.2.8-alpine
    cpus: 0.5
    mem_limit: 128m
    volumes:
      - ${GARAGE_CONFIG_DIR:-./config/generated}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8404/health]
      interval: 3s
      timeout: 3s
      retries: 30
  tools:
    image: ${COMPOSE_PROJECT_NAME:-garage-s3-cluster}-tools:dev
    build:
      context: ./.build/tools
      dockerfile: Dockerfile
    profiles: [tools]
    cpus: 2
    mem_limit: 2g
    environment:
      S3_ENDPOINT: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-GK0123456789abcdef01234567}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-only-object-storage-secret-key}
      BUCKET: lab-objects
      OBJECTS: ${OBJECTS:-10000}
      LARGE_OBJECTS: ${LARGE_OBJECTS:-128}
      CONCURRENCY: ${CONCURRENCY:-16}
      DURATION: ${DURATION:-900}
      BENCH_SMALL_REQUESTS: ${BENCH_SMALL_REQUESTS:-10000}
      BENCH_REQUESTS: ${BENCH_REQUESTS:-256}
      BENCH_LARGE_REQUESTS: ${BENCH_LARGE_REQUESTS:-128}
    volumes:
      - ./${RESULTS_DIR:-results/recovery}:/results
  multipart-workload:
    extends: tools
    profiles: [tools]
    entrypoint: [python, /app/multipart_workload.py]
  audit:
    extends: tools
    profiles: [tools]
    entrypoint: [python, /app/replica_audit.py]
    volumes:
      - data0:/disks/0:ro
      - data1:/disks/1:ro
      - data2:/disks/2:ro
      - data3:/disks/3:ro
      - data4:/disks/4:ro
      - data5:/disks/5:ro
      - data6:/disks/6:ro
      - data7:/disks/7:ro
      - data8:/disks/8:ro
      - meta0:/metadata/0:ro
      - meta1:/metadata/1:ro
      - meta2:/metadata/2:ro
      - meta3:/metadata/3:ro
      - meta4:/metadata/4:ro
      - meta5:/metadata/5:ro
      - meta6:/metadata/6:ro
      - meta7:/metadata/7:ro
      - meta8:/metadata/8:ro
volumes:
  meta0:
  data0:
  meta1:
  data1:
  meta2:
  data2:
  meta3:
  data3:
  meta4:
  data4:
  meta5:
  data5:
  meta6:
  data6:
  meta7:
  data7:
  meta8:
  data8:
